<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUSH — Reporte</title>

<!--
  Pagina APARTE de la app del supervisor, a proposito.

  El reporte es para el DUENO; la app es el telefono del SUPERVISOR.
  Meterlo en la misma pantalla le agregaria al supervisor un boton que no
  le sirve, y va contra la regla del CLAUDE.md de que cada boton hace algo
  que el necesita. Aqui la audiencia es otra: alguien sentado, leyendo
  numeros, no alguien parado mojandose con un carro esperando.

  Mismo codigo de acceso, otra URL. El telefono del supervisor nunca la ve.
-->

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:16px 14px 40px;
    background:#0d1117; color:#e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust:100%;
  }
  #logo { height:26px; width:auto; display:block; margin-bottom:14px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:#8b949e; font-size:14px; margin-bottom:18px; }

  select, button, input {
    font-family: inherit; font-size:16px;
    background:#161b22; color:#e6edf3;
    border:1px solid #30363d; border-radius:8px;
    padding:9px 12px;
  }
  button { cursor:pointer; }
  button:active { background:#30363d; }

  .barra { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }

  /* La fila del rango. Se separa un poco de la de arriba para que se
     lea como otra forma de consultar, no como parte del selector. */
  .barra.rango { margin-top:-10px; font-size:15px; color:#8b949e; }
  .barra.rango input[type="date"] {
    background:#161b22; color:#e6edf3; border:1px solid #30363d;
    border-radius:8px; padding:8px 10px; font-size:15px;
  }
  .barra.rango button {
    background:#21262d; color:#e6edf3; border:1px solid #30363d;
    border-radius:8px; padding:8px 16px; font-size:15px; font-weight:700;
    cursor:pointer;
  }
  .barra.rango button:active { background:#30363d; }

  /* Los seis numeros. Tarjetas grandes: es lo primero que se busca. */
  .numeros { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-bottom:22px; }
  .n {
    background:#161b22; border:1px solid #30363d; border-radius:12px;
    padding:14px 16px;
  }
  .n .valor { font-size:32px; font-weight:800; line-height:1.1; }
  .n .rotulo { color:#8b949e; font-size:13px; margin-top:4px; line-height:1.3; }
  .n .nota { color:#6e7681; font-size:12px; margin-top:6px; font-style:italic; }

  h2 { font-size:17px; margin:26px 0 10px; color:#adbac7; font-weight:700; }

  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid #21262d; }
  th { color:#8b949e; font-size:13px; font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:none; }

  .vacio { color:#6e7681; font-style:italic; padding:14px 0; }

  /* Los avisos honestos sobre que tan confiable es cada numero. No son
     decorativos: sin ellos el dueno lee un piso como si fuera un total. */
  .aviso {
    background:#1c2128; border-left:4px solid #d29922; border-radius:6px;
    padding:11px 13px; margin:14px 0; font-size:14px; color:#c9d1d9; line-height:1.45;
  }
  .aviso b { color:#e6edf3; }

  /* Cada tipo de servicio es su propia seccion. Mas chico que h2 para
     que se lea como subdivision de "Por equipo" y no como tema nuevo. */
  h3 {
    font-size:15px; margin:22px 0 6px; color:#e6edf3; font-weight:700;
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }
  h3 .cuantos { font-size:13px; font-weight:600; color:#8b949e; }

  /* La nota de cada seccion: explica por que se mide aparte. Sin la
     barra amarilla, que aqui no hay nada de que advertir. */
  .aviso.chico {
    background:transparent; border-left:none; padding:0 0 8px;
    margin:0; font-size:13px; color:#8b949e;
  }

  #acceso {
    position:fixed; inset:0; background:#0d1117;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:24px;
  }
  #acceso input { font-size:26px; text-align:center; letter-spacing:4px; width:100%; max-width:320px; }
  #malcodigo { color:#ff7875; display:none; }

  /* --- Switch Operación | Clientes --- */
  .switch { display:flex; gap:8px; margin-bottom:18px; }
  .switch button {
    flex:1; font-size:16px; font-weight:700; padding:11px 12px;
    background:#161b22; color:#8b949e; border:1px solid #30363d; border-radius:10px;
  }
  .switch button.on { background:#1f6feb; color:#fff; border-color:#1f6feb; }

  /* --- Buscador de clientes: lista de resultados --- */
  .lista { display:flex; flex-direction:column; gap:8px; margin:4px 0 10px; }
  .item {
    display:block; width:100%; text-align:left; position:relative;
    background:#161b22; border:1px solid #30363d; border-radius:12px; padding:12px 14px;
  }
  .item:active { background:#21262d; }
  .item-nom { font-size:18px; font-weight:800; color:#e6edf3; }
  .item-sub { font-size:13px; color:#8b949e; margin-top:3px; }
  .item-badge {
    position:absolute; top:12px; right:12px;
    background:#132e1b; color:#3fb950; border:1px solid #3fb950;
    border-radius:8px; padding:3px 9px; font-size:13px; font-weight:800;
  }

  /* --- Perfil (persona o placa) --- */
  .volver { background:transparent; border:none; color:#58a6ff; font-size:15px; padding:6px 0; margin-bottom:2px; cursor:pointer; }
  .perfil-nom { font-size:26px; margin:2px 0; }

  .tarjeta-lealtad {
    background:#161b22; border:1px solid #30363d; border-radius:16px;
    padding:16px; margin:12px 0 6px;
  }
  .tarjeta-lealtad.gratis { background:#132e1b; border-color:#3fb950; }
  .tl-fila { display:flex; gap:10px; }
  .tl-cel { flex:1; text-align:center; }
  .tl-num { font-size:30px; font-weight:900; color:#e6edf3; line-height:1; }
  .tl-num .tl-de { font-size:15px; font-weight:700; color:#8b949e; }
  .tl-rot { font-size:12px; color:#8b949e; margin-top:5px; }
  .tl-msg { text-align:center; margin-top:12px; font-size:15px; font-weight:700; color:#3fb950; }
  .tl-msg.tenue { color:#8b949e; font-weight:600; }
  .tl-placas { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
  .chip {
    background:#0d1117; border:1px solid #30363d; border-radius:8px;
    padding:5px 10px; font-size:14px; font-weight:700; letter-spacing:1px; color:#e6edf3;
  }
  .enlace { background:transparent; border:none; color:#58a6ff; font-size:14px; padding:0; cursor:pointer; text-align:left; font-family:inherit; }
  td .tenue, .tenue { color:#6e7681; }
</style>

<img id="logo" src="RUSH-Logo.png" alt="RUSH" onerror="this.style.display='none'">
<h1>Reporte</h1>

<!-- Dos secciones para la MISMA audiencia (el dueno, sentado): Operacion
     (secadores/tiempos por rango de fechas) y Clientes (buscador + perfiles
     de lealtad). Un switch, no una tercera URL: el dueno tiene un solo lugar.
     Cada modo es una tarea distinta, asi que no se apilan en un scroll. -->
<div class="switch">
  <button id="tab-op" class="on">Operación</button>
  <button id="tab-cli">Clientes</button>
</div>

<div id="vista-op">
  <div class="sub" id="encabezado">—</div>

  <div class="barra">
    <select id="dia"></select>
    <button id="respaldo">Descargar respaldo</button>
  </div>

  <!-- Rango de dias, como en Zettle: casilla inicial y casilla final.
       Va DEBAJO del selector de un dia y no lo reemplaza: ver "ayer" es
       lo que se hace todos los dias, y el rango es lo ocasional. -->
  <div class="barra rango">
    <label for="desde">Del</label>
    <input type="date" id="desde">
    <label for="hasta">al</label>
    <input type="date" id="hasta">
    <button id="ver-rango">Ver</button>
  </div>

  <div id="contenido"></div>
</div>

<div id="vista-cli" style="display:none">
  <div class="barra">
    <input id="cli-q" placeholder="Buscar cliente, placa, marca o modelo…"
           autocomplete="off" autocapitalize="none" style="flex:1; min-width:200px">
  </div>
  <div id="cli-res"><div class="vacio">Escribe un nombre, una placa, o una marca/modelo.</div></div>
</div>

<div id="acceso">
  <h2 style="color:#e6edf3">Código de acceso</h2>
  <input id="campo" inputmode="text" autocapitalize="characters" autocomplete="off">
  <div id="malcodigo">Código incorrecto</div>
  <button id="entrar" style="font-size:20px; padding:12px 30px">Entrar</button>
</div>

<script>
var API = "https://rwoyfvddhlabmmuvkpjx.supabase.co/functions/v1/app";

// Mismo codigo y mismo almacen que la app del supervisor: si el dueno ya
// entro en este navegador, no lo vuelve a teclear.
var CODIGO = "";

function cargarCodigo() {
  var enLiga = new URLSearchParams(location.search).get("c");
  if (enLiga) {
    CODIGO = enLiga.trim().toUpperCase();
    try { localStorage.setItem("rush_codigo", CODIGO); } catch (e) {}
    history.replaceState({}, "", location.pathname);
    return;
  }
  try { CODIGO = localStorage.getItem("rush_codigo") || ""; } catch (e) { CODIGO = ""; }
}

function pedir(ruta) {
  return fetch(API + ruta, { headers: { "x-codigo": CODIGO }, cache: "no-store" });
}

function pedirCodigo(fallo) {
  document.getElementById("acceso").style.display = "flex";
  document.getElementById("malcodigo").style.display = fallo ? "block" : "none";
  document.getElementById("campo").focus();
}

function escapar(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

// Los segundos crudos no le dicen nada a nadie. "34 min" si.
function duracion(seg) {
  if (seg == null) return "—";
  var m = Math.round(seg / 60);
  if (m < 60) return m + " min";
  var h = Math.floor(m / 60);
  return h + " h " + (m % 60) + " min";
}

function pintarReporte(r) {
  var placas = r.placas || {};
  var asp = r.aspirado || {};
  var html = "";

  html += '<div class="numeros">';
  html +=   tarjeta(r.vehiculos_lavados, "Vehículos lavados",
              r.vehiculos_sin_terminar ? r.vehiculos_sin_terminar + " entraron y no se han entregado" : "");
  // Solo aparece si hubo alguno. Un cero permanente en pantalla se vuelve
  // invisible; el numero importa justo el dia que NO es cero.
  if (r.cerrados_automaticamente) {
    html += tarjeta(r.cerrados_automaticamente, "Se cerraron solos",
              "Nadie los entregó; se cerraron al cierre. Sus tiempos no cuentan en los promedios");
  }
  // Igual que el anterior: solo aparece cuando no es cero. Un cero
  // permanente en pantalla se vuelve invisible, y este numero importa
  // justo el dia que NO es cero.
  if (r.descartados_por_tiempo) {
    html += tarjeta(r.descartados_por_tiempo, "No se contaron",
              "Entregados más rápido de lo posible (20 min, o 10 en express). Casi seguro error o prueba");
  }
  // Igual: solo si no es cero. Carros con secado de menos de 3 min — un
  // olvido asignado y entregado tarde de un jalon. Cuentan como lavado,
  // pero su secado no entra al promedio. Si sale alto, se estan olvidando
  // carros.
  if (r.secados_descartados) {
    html += tarjeta(r.secados_descartados, "Secados muy cortos",
              "Menos de 3 min de secado (imposible): olvidos entregados tarde. No cuentan en el promedio de secado");
  }
  html +=   tarjeta(duracion(r.espera_promedio_seg), "Espera promedio por carro",
              "De que paga a que se lo entregan");
  html +=   tarjeta(duracion(r.secado_promedio_seg), "Secado promedio", "General, todos los equipos");
  html +=   tarjeta(asp.con, "Con aspirado", "");
  html +=   tarjeta(asp.sin, "Sin aspirado", "");
  if (asp.sin_clasificar) {
    html += tarjeta(asp.sin_clasificar, "Sin clasificar",
              "Paquetes que no reconozco — avísame para agregarlos");
  }
  html += '</div>';

  // --- Equipos, separados por tipo de servicio ---
  //
  // No se comparan peras con manzanas: un equipo que seco express no se
  // mide contra uno que seco completos, y los encerados tardan mas por
  // naturaleza. Cada seccion se ordena y se lee por separado.
  //
  // El ORDEN importa: los completos van primero porque son la gran
  // mayoria del trabajo y es lo que de verdad hay que medir.
  var SECCIONES = [
    { clave: "con_aspirado",   titulo: "Paquetes completos (con aspirado)",
      nota: "La mayoría del trabajo. Es la sección que más importa medir." },
    { clave: "sin_aspirado",   titulo: "Express (sin aspirado)",
      nota: "Menos trabajo por carro; sus tiempos no se comparan con los completos." },
    { clave: "encerado",       titulo: "Encerado manual y superbrillo",
      nota: "Tardan más por naturaleza. Se miden solo contra sí mismos." },
    { clave: "sin_clasificar", titulo: "Sin clasificar",
      nota: "Productos que no reconozco. Avísame el nombre exacto y los acomodo." }
  ];

  html += "<h2>Por equipo</h2>";
  var eq = r.equipos || [];
  var porTipo = r.por_tipo || {};

  if (!eq.length) {
    html += '<div class="vacio">Ningún carro tuvo secador asignado este día.</div>';
  } else {
    for (var s = 0; s < SECCIONES.length; s++) {
      var sec = SECCIONES[s];
      var filas = eq.filter(function (x) { return (x.tipo || "sin_clasificar") === sec.clave; });
      // Una seccion vacia no se pinta. "Sin clasificar" en cero es lo
      // normal, y un titulo en blanco todos los dias se vuelve ruido.
      if (!filas.length) continue;

      var carrosDelTipo = porTipo[sec.clave] || 0;
      html += "<h3>" + escapar(sec.titulo) +
              (carrosDelTipo ? ' <span class="cuantos">' + carrosDelTipo + " carros</span>" : "") +
              "</h3>";
      html += '<div class="aviso chico">' + escapar(sec.nota) + "</div>";
      html += '<table><tr><th>Equipo</th><th class="num">Carros</th><th class="num">Secado promedio</th><th class="num">Le entraron encimados</th></tr>';
      for (var i = 0; i < filas.length; i++) {
        var enc = filas[i].encimados || 0;
        var pct = filas[i].carros ? Math.round(enc * 100 / filas[i].carros) : 0;
        html += "<tr><td>" + escapar(filas[i].equipo) + "</td>" +
                '<td class="num">' + filas[i].carros + "</td>" +
                '<td class="num">' + duracion(filas[i].secado_promedio_seg) + "</td>" +
                '<td class="num">' + (enc ? enc + " (" + pct + "%)" : "—") + "</td></tr>";
      }
      html += "</table>";
    }
    html += '<div class="aviso"><b>"Le entraron encimados"</b> = carros que llegaron cuando esa persona ' +
            'ya estaba secando otro, así que tuvieron que esperar su turno. Ese rato de espera se cuenta ' +
            'como secado, así que <b>a quien más carga le sube el promedio sin ser más lento</b>. ' +
            'Un secado alto con muchos encimados es saturación, no lentitud.</div>';
    html += '<div class="aviso">El promedio de secado sale de los carros que <b>ya terminaron</b>. ' +
            'Un equipo con carros todavía secando aparece con menos tiempo del que va a tener. ' +
            'Un mismo equipo puede salir en varias secciones: se le mide aparte lo que hizo de cada tipo.</div>';
  }

  // --- Placas ---
  html += "<h2>Placas leídas</h2>";
  var conPlaca = placas.con_placa || 0;
  var totalCarros = placas.carros || 0;
  html += '<div class="numeros">';
  html +=   tarjeta(conPlaca + " de " + totalCarros, "Carros con placa leída",
              (placas.con_foto || 0) + " tuvieron foto");
  html += '</div>';

  if (conPlaca < totalCarros) {
    html += '<div class="aviso">La placa sale de la foto, y la foto es <b>opcional</b>. ' +
            'De ' + totalCarros + ' carros se leyó la placa de ' + conPlaca + '. ' +
            'Por eso el historial de visitas es un <b>piso, no un total</b>: si dice que una placa vino 3 veces, ' +
            'vino 3 veces <b>o más</b>.</div>';
  }

  return html;
}

function tarjeta(valor, rotulo, nota) {
  return '<div class="n"><div class="valor">' + escapar(valor == null ? "—" : valor) + "</div>" +
         '<div class="rotulo">' + escapar(rotulo) + "</div>" +
         (nota ? '<div class="nota">' + escapar(nota) + "</div>" : "") + "</div>";
}

function pintarPlacas(lista) {
  var html = "<h2>Historial por placa</h2>";
  html += '<div class="barra"><input id="buscar" placeholder="Buscar placa…" style="flex:1; min-width:160px"></div>';
  html += '<div id="tablaplacas"></div>';
  return html;
}

function tablaPlacas(placas) {
  if (!placas.length) return '<div class="vacio">Todavía no hay placas leídas.</div>';
  var html = '<table><tr><th>Placa</th><th class="num">Visitas</th><th>Carro</th><th>Última vez</th></tr>';
  for (var i = 0; i < placas.length; i++) {
    var p = placas[i];
    var carro = [p.tipo_unidad, p.color, p.marca].filter(Boolean).join(" ");
    html += "<tr><td><b>" + escapar(p.placa_como_se_lee || p.placa) + "</b></td>" +
            '<td class="num">' + p.visitas + "</td>" +
            "<td>" + escapar(carro || "—") + "</td>" +
            "<td>" + escapar(new Date(p.ultima_visita).toLocaleDateString("es-MX")) + "</td></tr>";
  }
  return html + "</table>";
}

function cargarPlacas(q) {
  pedir("/placas" + (q ? "?q=" + encodeURIComponent(q) : ""))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      document.getElementById("tablaplacas").innerHTML = tablaPlacas(d.placas || []);
    })
    .catch(function () {
      document.getElementById("tablaplacas").innerHTML = '<div class="vacio">No se pudo cargar.</div>';
    });
}

function cargarDia(fecha) { cargarReporte("/reporte?fecha=" + fecha); }

// Un rango NUNCA sale de las filas congeladas: esas son por dia, y los
// promedios hay que ponderarlos por carro, no promediar promedios. Se
// calcula al vuelo, que es lo correcto aunque recorra mas datos.
function cargarRango(desde, hasta) {
  cargarReporte("/reporte?desde=" + desde + "&hasta=" + hasta);
}

function cargarReporte(ruta) {
  document.getElementById("contenido").innerHTML = '<div class="vacio">Cargando…</div>';
  pedir(ruta)
    .then(function (r) {
      if (r.status === 401) { pedirCodigo(true); throw new Error("codigo"); }
      return r.json();
    })
    .then(function (r) {
      if (r && r.error) {
        document.getElementById("contenido").innerHTML =
          '<div class="vacio">' + r.error + "</div>";
        return;
      }
      document.getElementById("encabezado").textContent =
        (r.dias && r.dias > 1)
          ? r.dias + " días, del " + r.desde + " al " + r.hasta
          : (r.congelado_en
              ? "Corte cerrado el " + new Date(r.congelado_en).toLocaleString("es-MX")
              : "Día en curso — todavía puede cambiar");
      document.getElementById("contenido").innerHTML = pintarReporte(r) + pintarPlacas();
      cargarPlacas("");
      var b = document.getElementById("buscar");
      if (b) b.addEventListener("input", function () { cargarPlacas(b.value.trim()); });
    })
    .catch(function (e) {
      if (e && e.message === "codigo") return;
      document.getElementById("contenido").innerHTML =
        '<div class="vacio">No se pudo cargar el reporte.</div>';
    });
}

function arrancar() {
  pedir("/reportes")
    .then(function (r) {
      if (r.status === 401) { pedirCodigo(true); throw new Error("codigo"); }
      return r.json();
    })
    .then(function (d) {
      var sel = document.getElementById("dia");
      sel.innerHTML = "";
      (d.dias || []).forEach(function (x) {
        var o = document.createElement("option");
        o.value = x.fecha;
        o.textContent = x.fecha + (x.congelado_en ? "" : "  (en curso)");
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () { cargarDia(sel.value); });
      if (sel.value) cargarDia(sel.value);

      // Las casillas del rango arrancan con el dia mas viejo y el mas
      // nuevo que hay: asi el dueno puede darle "Ver" de inmediato en
      // vez de tener que adivinar desde cuando hay datos.
      var fechas = (d.dias || []).map(function (x) { return x.fecha; }).sort();
      if (fechas.length) {
        document.getElementById("desde").value = fechas[0];
        document.getElementById("hasta").value = fechas[fechas.length - 1];
      }
    })
    .catch(function (e) {
      if (e && e.message === "codigo") return;
      document.getElementById("contenido").innerHTML =
        '<div class="vacio">No se pudo conectar.</div>';
    });
}

document.getElementById("ver-rango").addEventListener("click", function () {
  var desde = document.getElementById("desde").value;
  var hasta = document.getElementById("hasta").value;
  if (!desde || !hasta) { alert("Escoge los dos días."); return; }
  if (desde > hasta)   { alert("El día inicial es posterior al final."); return; }
  cargarRango(desde, hasta);
});

document.getElementById("respaldo").addEventListener("click", function () {
  pedir("/respaldo")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      // Se baja como archivo para que viva fuera de Supabase. Ese es el
      // punto: si un dia se pierde la cuenta, los numeros siguen aqui.
      var blob = new Blob([JSON.stringify(d, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "rush-respaldo-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
    })
    .catch(function () { alert("No se pudo bajar el respaldo."); });
});

document.getElementById("entrar").addEventListener("click", function () {
  var v = document.getElementById("campo").value.trim().toUpperCase();
  if (!v) return;
  CODIGO = v;
  try { localStorage.setItem("rush_codigo", CODIGO); } catch (e) {}
  document.getElementById("acceso").style.display = "none";
  arrancar();
});
document.getElementById("campo").addEventListener("keydown", function (ev) {
  if (ev.key === "Enter") document.getElementById("entrar").click();
});

// =====================================================================
// Sección CLIENTES — buscador + perfiles de lealtad. Reusa el CRM de caja
// (mismos endpoints /personas, /historial, /placas). El dueño, sentado,
// buscando a una persona o una placa; no es la pantalla del supervisor.
// =====================================================================

function pedirJSON(ruta) {
  return pedir(ruta).then(function (r) {
    if (r.status === 401) { pedirCodigo(true); throw new Error("codigo"); }
    return r.json();
  });
}

// --- Switch entre las dos vistas ---
function mostrarVista(cual) {
  var op = cual === "op";
  document.getElementById("vista-op").style.display = op ? "" : "none";
  document.getElementById("vista-cli").style.display = op ? "none" : "";
  document.getElementById("tab-op").className = op ? "on" : "";
  document.getElementById("tab-cli").className = op ? "" : "on";
  if (!op) document.getElementById("cli-q").focus();
}
document.getElementById("tab-op").addEventListener("click", function () { mostrarVista("op"); });
document.getElementById("tab-cli").addEventListener("click", function () { mostrarVista("cli"); });

// --- Buscar: nombre/placa -> personas; placa/marca/submarca -> vehículos ---
var cliTimer = null;
document.getElementById("cli-q").addEventListener("input", function () {
  var q = this.value.trim();
  clearTimeout(cliTimer);
  cliTimer = setTimeout(function () { cliBuscar(q); }, 250);
});

function cliBuscar(q) {
  var cont = document.getElementById("cli-res");
  if (q.length < 2) { cont.innerHTML = '<div class="vacio">Escribe al menos 2 letras.</div>'; return; }
  cont.innerHTML = '<div class="vacio">Buscando…</div>';
  Promise.all([
    pedirJSON("/personas?q=" + encodeURIComponent(q)).catch(function (e) { if (e && e.message === "codigo") throw e; return { personas: [] }; }),
    pedirJSON("/placas?q=" + encodeURIComponent(q)).catch(function (e) { if (e && e.message === "codigo") throw e; return { placas: [] }; })
  ]).then(function (res) {
    // Si el dueño siguió escribiendo, esta respuesta ya no aplica.
    if (document.getElementById("cli-q").value.trim() !== q) return;
    cliResultados(res[0].personas || [], res[1].placas || []);
  }).catch(function (e) { if (e && e.message === "codigo") return; cont.innerHTML = '<div class="vacio">No se pudo buscar.</div>'; });
}

function cliResultados(personas, placas) {
  var html = "";
  if (!personas.length && !placas.length) html = '<div class="vacio">Nada encontrado.</div>';

  if (personas.length) {
    html += '<h2>Clientes</h2><div class="lista">';
    personas.forEach(function (p) {
      var l = p.lealtad || {};
      var sub = [];
      if (p.telefono) sub.push(escapar(p.telefono));
      if (p.placas && p.placas.length) sub.push(escapar(p.placas.join(" · ")));
      html += '<button class="item" data-persona="' + p.id + '">' +
              '<div class="item-nom">' + escapar(p.nombre || "(sin nombre)") + "</div>" +
              (sub.length ? '<div class="item-sub">' + sub.join(" · ") + "</div>" : "") +
              (l.disponibles ? '<div class="item-badge">' + l.disponibles + " gratis</div>" : "") +
              "</button>";
    });
    html += "</div>";
  }

  if (placas.length) {
    html += '<h2>Vehículos</h2><div class="lista">';
    placas.forEach(function (v) {
      var desc = [v.marca, v.submarca, v.tipo_unidad, v.color].filter(Boolean).join(" ");
      var meta = v.visitas + (v.visitas === 1 ? " visita" : " visitas") + (v.cliente ? " · " + escapar(v.cliente) : "");
      html += '<button class="item" data-placa="' + escapar(v.placa_como_se_lee || v.placa) + '">' +
              '<div class="item-nom">' + escapar(v.placa_como_se_lee || v.placa) + "</div>" +
              '<div class="item-sub">' + (desc ? escapar(desc) + " · " : "") + meta + "</div>" +
              "</button>";
    });
    html += "</div>";
  }

  var cont = document.getElementById("cli-res");
  cont.innerHTML = html;
  cliCablearBotones(cont);
}

// Cablea los botones data-persona / data-placa de un contenedor.
function cliCablearBotones(cont) {
  var ps = cont.querySelectorAll("button[data-persona]");
  for (var i = 0; i < ps.length; i++) (function (b) {
    b.addEventListener("click", function () { abrirPersona(b.getAttribute("data-persona")); });
  })(ps[i]);
  var vs = cont.querySelectorAll("button[data-placa]");
  for (var j = 0; j < vs.length; j++) (function (b) {
    b.addEventListener("click", function () { abrirPlaca(b.getAttribute("data-placa")); });
  })(vs[j]);
}

function volverABuscar() { cliBuscar(document.getElementById("cli-q").value.trim()); }

// --- Perfil de una PERSONA: tarjeta de lealtad + sus visitas ---
function abrirPersona(id) {
  var cont = document.getElementById("cli-res");
  cont.innerHTML = '<div class="vacio">Cargando…</div>';
  Promise.all([
    pedirJSON("/personas?id=" + encodeURIComponent(id)),
    pedirJSON("/historial?persona=" + encodeURIComponent(id))
  ]).then(function (res) {
    perfilPersona(res[0].persona || {}, res[1].historial || []);
  }).catch(function (e) { if (e && e.message === "codigo") return; cont.innerHTML = '<div class="vacio">No se pudo cargar el perfil.</div>'; });
}

function perfilPersona(p, historial) {
  var l = p.lealtad || {};
  var html = '<button class="volver" id="cli-volver">← Volver a la búsqueda</button>';
  html += '<div class="perfil-nom">' + escapar(p.nombre || "(sin nombre)") + "</div>";
  if (p.telefono) html += '<div class="sub">' + escapar(p.telefono) + "</div>";

  html += '<div class="tarjeta-lealtad' + (l.disponibles ? " gratis" : "") + '">';
  html +=   '<div class="tl-fila">';
  html +=     '<div class="tl-cel"><div class="tl-num">' + (l.sellos != null ? l.sellos : "—") + '<span class="tl-de">/5</span></div><div class="tl-rot">Sellos</div></div>';
  html +=     '<div class="tl-cel"><div class="tl-num">' + (l.disponibles || 0) + '</div><div class="tl-rot">Lavados gratis</div></div>';
  html +=     '<div class="tl-cel"><div class="tl-num">' + (l.visitas_totales || 0) + '</div><div class="tl-rot">Visitas</div></div>';
  html +=   "</div>";
  html +=   l.disponibles
    ? '<div class="tl-msg">Tiene ' + l.disponibles + (l.disponibles === 1 ? " lavado gratis" : " lavados gratis") + " por canjear</div>"
    : '<div class="tl-msg tenue">Le faltan ' + (l.faltan != null ? l.faltan : "—") + " para el siguiente gratis</div>";
  if (p.placas && p.placas.length) {
    html += '<div class="tl-placas">';
    p.placas.forEach(function (pl) { html += '<span class="chip">' + escapar(pl) + "</span>"; });
    html += "</div>";
  }
  html += "</div>";

  html += "<h2>Visitas</h2>" + tablaVisitas(historial, false);

  var cont = document.getElementById("cli-res");
  cont.innerHTML = html;
  document.getElementById("cli-volver").addEventListener("click", volverABuscar);
}

// --- Perfil de una PLACA: todas sus visitas, con la persona de lealtad ---
function abrirPlaca(placa) {
  var cont = document.getElementById("cli-res");
  cont.innerHTML = '<div class="vacio">Cargando…</div>';
  pedirJSON("/historial?placa=" + encodeURIComponent(placa)).then(function (d) {
    perfilPlaca(placa, d.historial || []);
  }).catch(function (e) { if (e && e.message === "codigo") return; cont.innerHTML = '<div class="vacio">No se pudo cargar.</div>'; });
}

function perfilPlaca(placa, historial) {
  var html = '<button class="volver" id="cli-volver">← Volver a la búsqueda</button>';
  html += '<div class="perfil-nom">' + escapar(placa) + "</div>";
  var v0 = historial[0];
  if (v0) {
    var desc = [v0.marca, v0.submarca, v0.tipo, v0.color].filter(Boolean).join(" ");
    if (desc) html += '<div class="sub">' + escapar(desc) + "</div>";
  }
  html += '<div class="sub">' + historial.length + (historial.length === 1 ? " visita" : " visitas") + "</div>";
  html += "<h2>Visitas</h2>" + tablaVisitas(historial, true);

  var cont = document.getElementById("cli-res");
  cont.innerHTML = html;
  document.getElementById("cli-volver").addEventListener("click", volverABuscar);
  cliCablearBotones(cont); // los enlaces a la persona de lealtad de cada visita
}

// Tabla de visitas compartida. conPersona=true agrega la columna de la
// persona de lealtad (solo en el perfil de placa; en el de persona es ella).
function tablaVisitas(lista, conPersona) {
  if (!lista.length) return '<div class="vacio">Sin visitas registradas.</div>';
  var html = '<table><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Secó</th>' +
             (conPersona ? "<th>Cliente</th>" : "") + "</tr>";
  lista.forEach(function (v) {
    html += "<tr><td>" + escapar(fechaCorta(v.fecha)) + "</td>" +
            "<td>" + escapar(hora(v.entrada)) + "</td>" +
            "<td>" + escapar(hora(v.salida)) + "</td>" +
            "<td>" + escapar((v.secadores && v.secadores.length) ? v.secadores.join(", ") : "—") + "</td>";
    if (conPersona) {
      if (v.persona && v.persona.id) {
        html += '<td><button class="enlace" data-persona="' + v.persona.id + '">' + escapar(v.persona.nombre) + "</button></td>";
      } else {
        html += '<td class="tenue">— sin asignar</td>';
      }
    }
    html += "</tr>";
  });
  return html + "</table>";
}

function fechaCorta(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("es-MX", { day: "2-digit", month: "short", year: "numeric" });
}
function hora(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
}

cargarCodigo();
if (!CODIGO) pedirCodigo(false); else arrancar();
</script>
