<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUSH — Panel de administración</title>

<!--
  Cuarta app del proyecto (10/oct/2026). La usa el ADMINISTRADOR, sentado,
  para corregir el CRM: fusionar fichas duplicadas, borrar fichas vacias, quitar
  y agregar visitas, mover placas. No la usan ni el supervisor ni la cajera.

  Habla con la Edge Function `admin` (NO con `app`): codigo propio del panel
  (CODIGO_ADMIN) y cabecera x-quien, porque toda accion queda en bitacora con
  nombre. Toda la logica vive en la base (migraciones 192-195): aqui no hay
  copia de ninguna regla (ni lealtad, ni fonetica, ni tipos): lo que se pinta
  lo calculo el servidor. La VISTA PREVIA de cada accion es la misma funcion
  con `ensayo: true`, que calcula sin escribir.

  Los botones van por `data-act` + un solo despacho (ver abajo), no por
  onclick="..." en el HTML: asi lo exige la pagina del prototipo y asi queda
  todo en un lugar.

  JavaScript clasico (var, function, concatenacion): pruebas/sintaxis-front.sh
  lo parsea con el interprete de Windows, que no entiende ES6.
-->

<style>

    color-scheme: dark;

  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primario { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.peligro { background:var(--rojo); border-color:var(--rojo); color:#fff; }
  button.peligro.suave { background:transparent; color:var(--rojo); }
  button.liso { background:transparent; border-color:transparent; color:var(--accent); padding:4px 8px; }
  button.chico { padding:4px 10px; font-size:13px; }
  /* Un número de ticket que abre su detalle (Facturación): se ve como enlace, no como botón. */
  button.enlace { background:transparent; border:0; border-radius:0; padding:0; color:var(--accent); text-decoration:underline; font:inherit; font-weight:inherit; }
  input[type=text], input[type=search], select, textarea { background:var(--card); border:1px solid var(--borde); border-radius:8px; padding:9px 11px; width:100%; }
  a { color:var(--accent); cursor:pointer; text-decoration:none; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:17px; margin:0 0 10px; color:var(--fg); }

  .mono { font-variant-numeric:tabular-nums; }

  .fac-num { font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--fg); }

  #acceso { min-height:100vh; display:grid; place-items:center; padding:24px 16px; }

  .marca { font-weight:800; letter-spacing:.02em; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }

  .tile .r { color:var(--muted); font-size:12px; margin-top:4px; }
  .tile.ok { border-color:var(--verde); } .tile.ojo { border-color:var(--ambar); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--borde); vertical-align:top; }
  th { color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.apagada td { color:var(--muted2); text-decoration:line-through; }
  tr.apagada td.acc { text-decoration:none; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--card2); }
  .tabla-wrap { overflow-x:auto; }

  .chip.verde { color:var(--verde); border-color:var(--verde); background:var(--verde-f); }
  .chip.ambar { color:var(--ambar); border-color:var(--ambar); background:var(--ambar-f); }
  .chip.rojo { color:var(--rojo); border-color:var(--rojo); background:var(--rojo-f); }

  .aviso { background:var(--card2); border-left:4px solid var(--ambar); border-radius:6px; padding:10px 12px; font-size:14px; }

  .aviso.verde { border-left-color:var(--verde); }
  .vacio { color:var(--muted2); font-style:italic; padding:12px 0; }

  .acciones { display:flex; gap:8px; flex-wrap:wrap; }
  .lado { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:720px) { .lado { grid-template-columns:1fr; } }
  .col { background:var(--card2); border:2px solid var(--borde); border-radius:12px; padding:14px; }

  .kv { display:grid; grid-template-columns:120px 1fr; gap:4px 10px; font-size:14px; }

  .prev .ant .n, .prev .des .n { font-size:22px; font-weight:800; }
  .prev .fl { color:var(--muted); font-size:22px; }
  .prev .des .n { color:var(--verde); }
  .campo { display:grid; gap:6px; }
  .campo label { font-size:13px; color:var(--muted); font-weight:600; }
  .form { display:grid; gap:12px; }
  .radios { display:flex; gap:8px; flex-wrap:wrap; }
  .radios label { border:1px solid var(--borde); border-radius:8px; padding:8px 12px; cursor:pointer; display:flex; gap:6px; align-items:center; }
  .radios label.sel { border-color:var(--accent); background:var(--card2); }
  .buscar { display:flex; gap:8px; }
  .buscar input { flex:1; }
  .pasos { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:13px; flex-wrap:wrap; }

  .res { border:1px solid var(--borde); border-radius:10px; overflow:hidden; }

  #modal { background:var(--card); border:1px solid var(--borde); border-radius:14px; padding:20px; width:100%; max-width:640px; max-height:92vh; overflow:auto; box-shadow:var(--sombra); display:grid; gap:14px; }
  #modal.ancho { max-width:900px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; z-index:30; box-shadow:var(--sombra); max-width:90vw; }
  .progreso { height:8px; background:var(--borde); border-radius:999px; overflow:hidden; margin-top:6px; }
  .progreso i { display:block; height:100%; background:var(--verde); }
  /* Pestaña Caja (211): rango de fechas, lado a lado y tablas por dia */
  .rango { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  .rango input[type=date] { background:var(--card); border:1px solid var(--borde); border-radius:8px; padding:8px 10px; min-width:150px; }
  .presets { display:flex; gap:6px; flex-wrap:wrap; }
  .presets button.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  /* Una columna por cajera (--cols la pone la pantalla); en angosto las columnas se encogen antes de desplazar. */
  .comp { display:grid; grid-template-columns: minmax(180px,1.4fr) repeat(var(--cols, 2), minmax(110px,1fr)); }
  @media (max-width:520px) { .comp { grid-template-columns: minmax(120px,1.2fr) repeat(var(--cols, 2), minmax(84px,1fr)); } }
  .tile.mal { border-color:var(--rojo); }
  .comp > div { padding:9px 10px; border-bottom:1px solid var(--borde); min-width:0; }
  .comp .enc { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .comp .enc.caj { font-size:15px; text-transform:none; letter-spacing:0; color:var(--fg); font-weight:800; }
  .comp .lbl { font-size:14px; }
  /* Supervisores (221): el punto del color del perfil junto a su nombre. */
  .punto { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; border:1px solid rgba(0,0,0,.25); }
  .comp .num { text-align:right; font-variant-numeric:tabular-nums; }

  .comp .gana { color:var(--verde); font-weight:700; }
  .comp .pct { color:var(--muted); font-size:12px; margin-left:4px; }
  .barra-ef { display:inline-block; width:56px; height:6px; background:var(--borde); border-radius:999px; vertical-align:middle; margin-right:6px; overflow:hidden; }
  .barra-ef i { display:block; height:100%; background:var(--verde); }
  .barra-ef.ojo i { background:var(--ambar); }
  .barra-ef.mal i { background:var(--rojo); }
  .turno { font-size:12px; color:var(--muted); white-space:nowrap; }
  .nota { color:var(--muted); font-size:13px; }
  .interruptor { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-size:14px; }

  .cajas-dia { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:14px; }
  @media (max-width:420px) { .cajas-dia { grid-template-columns:1fr; } }
  .leyenda { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); align-items:center; }

  .leyenda .l-ok::before { background:var(--verde); } .leyenda .l-ojo::before { background:var(--ambar); } .leyenda .l-mal::before { background:var(--rojo); }
  /* Pestaña Comisiones (215): un renglon de devolucion se ve en rojo */
  tr.dev td { color:var(--rojo); }
  tr.dev td .muted { color:var(--rojo); opacity:.8; }
  /* El reporte del dueño dentro del panel (243): tendencia, chips, galeria */
  .tile .spark { display:block; width:100%; height:30px; margin-top:8px; }
  .tile .delta { font-size:12px; margin-top:4px; color:var(--muted); }
  .tile .delta.ok { color:var(--verde); } .tile .delta.mal { color:var(--rojo); }
  .tile .v small { font-size:14px; font-weight:600; color:var(--muted); margin-left:4px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  th.orden { cursor:pointer; user-select:none; } th.orden.on { color:var(--fg); } th.orden.on::after { content:" ▾"; }
  .alerta-rep .rep, .aviso .rep { display:flex; gap:12px; flex-wrap:wrap; align-items:baseline; padding:6px 0; border-top:1px solid var(--borde); margin-top:6px; }
  .pie-op { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; color:var(--muted); font-size:13px; }
  .tenue { color:var(--muted2); }
  .mini { font-size:12px; color:var(--muted); font-weight:400; }
  .refresco { font-size:13px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .refresco i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--verde); }

  .item.click { cursor:pointer; } .item.click:hover { background:var(--card2); }
  .galeria { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-top:8px; }
  .galeria figure { margin:0; }
  .galeria img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; border:1px solid var(--borde); display:block; }
  .galeria figcaption { font-size:12px; color:var(--muted); margin-top:4px; }
  .galeria .foto-sinurl { aspect-ratio:4/3; display:grid; place-items:center; background:var(--card2); border-radius:8px; color:var(--muted2); font-size:12px; }
</style>

<div id="acceso">
  <div class="caja">
    <div class="marca">RUSH · Panel de administración</div>
    <div class="muted chico-t">Es el código del panel, no el de la app del supervisor.</div>
    <div class="campo"><label for="campo">Código del panel</label><input id="campo" type="password" inputmode="text" autocapitalize="characters" autocomplete="off"></div>
    <div class="campo"><label>¿Quién eres?</label>
      <div class="quien" id="quienes"><div class="muted chico-t" style="grid-column:1/-1">Escribe el código y aparecen los nombres.</div></div>
      <div class="muted chico-t">Tu nombre queda en la bitácora de cada cambio.</div>
    </div>
    <div id="malcodigo" class="aviso rojo" hidden>Código incorrecto</div>
    <div id="login-err" class="aviso rojo" hidden></div>
    <button class="primario" id="entrar" type="button" style="padding:14px;font-size:16px">Entrar</button>
  </div>
</div>

<div id="app" hidden>
  <header class="barra">
    <div class="marca">RUSH · Panel</div>
    <nav class="tabs" id="tabs"></nav>
    <span class="yo" id="yo"></span>
    <button class="chico" id="salir" type="button">Salir</button>
  </header>
  <main id="vista"></main>
</div>
<div id="modal-fondo" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script>
var API = "https://rwoyfvddhlabmmuvkpjx.supabase.co/functions/v1/admin";
var PEDIR_CORTE_MS = 20000;

var CODIGO = "", QUIEN = "", QUIEN_ETIQUETA = "";
// clave -> nombre. Lo manda el servidor (/quienes, tabla admin_quienes): los
// nombres de personas no viven en esta pagina, que es publica.
var QUIENES = {};
var MOTIVOS = [];
var VISTA = { n: "bandeja" }, NAV = [], TOKEN = 0, PENDIENTES_N = null;
var TIPO = { normal: ["Normal", "verde"], canje: ["Canje", "morado"], cortesia: ["Cortesía", "cian"] };

// ---------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------
function $(s) { return document.querySelector(s); }
function h(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function act(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return 'data-act="' + fn + '" data-args="' + h(JSON.stringify(args)) + '"';
}
function on(ev, fn) {
  var args = Array.prototype.slice.call(arguments, 2);
  return 'data-on="' + ev + '" data-act="' + fn + '" data-args="' + h(JSON.stringify(args)) + '"';
}
var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
function fmtFecha(iso, conHora) {
  if (!iso) return "—";
  // Una fecha sin hora ("2026-10-10") se formatea tal cual: `new Date` la
  // leeria como medianoche UTC y en Mexicali saldria el dia anterior.
  var solo = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
  if (solo) return (+solo[3]) + "/" + MESES[+solo[2] - 1] + "/" + solo[1];
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  var p = {};
  try {
    var partes = new Intl.DateTimeFormat("es-MX", { timeZone: "America/Tijuana", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(d);
    for (var i = 0; i < partes.length; i++) p[partes[i].type] = partes[i].value;
  } catch (e) { return d.toLocaleString(); }
  var s = p.day + "/" + MESES[+p.month - 1] + "/" + p.year;
  if (conHora !== false) s += " " + p.hour + ":" + p.minute;
  return s;
}
function pesos(n) { return "$" + Number(n || 0).toLocaleString("es-MX"); }
function pl(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
function chipTipo(t) { var x = TIPO[t] || ["?", ""]; return '<span class="chip ' + x[1] + '">' + x[0] + "</span>"; }
function lealtadTxt(L) {
  if (!L) return "—";
  return (L.sellos || 0) + "/5 · " + pl(L.disponibles || 0, "gratis disponible", "gratis disponibles") + " · " + pl(L.canjes || 0, "canje", "canjes");
}
function cargando(t) { return '<div class="cargando">' + h(t || "Cargando…") + "</div>"; }
function errorHTML(e) {
  return '<div class="aviso rojo"><b>No se pudo consultar.</b> ' + h(e && e.message ? e.message : e) + ' Esto no quiere decir que no haya nada: quiere decir que la consulta falló. <a ' + act("render") + '>Reintentar</a></div>';
}
function retrasar(fn, ms) { var t; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; }

// ---------------------------------------------------------------------
// Peticiones. Igual que reporte.html (corte de 20 s, 401 pide el codigo, un
// `ok:false` es error), mas la cabecera x-quien.
// ---------------------------------------------------------------------
function pedir(ruta, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ "x-codigo": CODIGO, "x-quien": QUIEN }, opts.headers || {});

    if (r.status === 503) { throw new Error("El servidor no tiene configurado el código del panel"); }
    return r.json().then(function (d) {
      if (!r.ok && (!d || d.ok === undefined)) throw new Error("El servidor respondió " + r.status);

function esFecha(x) { return /^\d{4}-\d{2}-\d{2}$/.test(String(x || "")); }

function vCaja(v, pinta) {
  if (!esFecha(v.desde) || !esFecha(v.hasta)) {
    if (CAJA_RANGO) { v.desde = CAJA_RANGO.desde; v.hasta = CAJA_RANGO.hasta; v.preset = CAJA_RANGO.preset; }
    else { var hoy = hoyLocal(); v.hasta = hoy; v.desde = sumarDias(hoy, -6); v.preset = "7"; }
  }
  CAJA_RANGO = { desde: v.desde, hasta: v.hasta, preset: v.preset };
  // El interruptor "sin pickups" solo cambia columnas: se repinta lo ya bajado.
  if (CAJA_CACHE && CAJA_CACHE.fresca && CAJA_CACHE.desde === v.desde && CAJA_CACHE.hasta === v.hasta) {
    CAJA_CACHE.fresca = false; pinta(cajaHTML(v, CAJA_CACHE.d)); return;
  }
  pinta(cargando());
  // Sin lista=1: la vista principal no usa la lista de sin tocar, solo el conteo.
  pedirJSON("/reporte-cajeras?desde=" + encodeURIComponent(v.desde) + "&hasta=" + encodeURIComponent(v.hasta)).then(function (d) {
    if (!d || !d.cajeras) { pinta(cajaControles(v) + errorHTML("La respuesta no trae el reporte.")); return; }
    CAJA_CACHE = { desde: v.desde, hasta: v.hasta, d: d, fresca: false };
    pinta(cajaHTML(v, d));
  // Con el error se pintan tambien los controles: un rango de mas de 120 dias
  // lo rechaza la base, y sin las casillas el dueno no tenia como corregirlo
  // ("Reintentar" repetia el mismo rango).
  }, function (e) { if (e.message !== "codigo") pinta(cajaControles(v) + errorHTML(e)); });
}

function cajaControles(v) {

    rangoHTML("caja", v, RANGO_MAX.caja) +
    '<div class="presets">';
  for (var i = 0; i < presets.length; i++) html += '<button type="button" class="chico ' + (v.preset === presets[i][0] ? "on" : "") + '" ' + act("cajaPreset", presets[i][0]) + ">" + presets[i][1] + "</button>";
  html += "</div>" +
    '<label class="interruptor" style="margin-left:auto"><input type="checkbox" id="caja-sinpu" ' + (CAJA_SIN_PU ? "checked" : "") + " " + on("change", "cajaSinPu") + "> Placa leída sin pickups</label>" +
    "</div></div>";
  return html;
}

// Los modales vuelven a preguntar a la base (el rango de la vista, o un dia):

var CAJA_MODAL = 0;

  var mi = ++CAJA_MODAL, token = TOKEN;

    if (mi !== CAJA_MODAL || token !== TOKEN || VISTA.n !== "caja") return;

      (lista.length ? '<div class="tabla-wrap"><table><thead><tr><th>Cuándo</th><th>Cajera</th><th>Carro</th><th>Nota de caja</th><th>Servicio</th><th></th></tr></thead><tbody>' + filas + "</tbody></table></div>" : '<div class="vacio">Ninguno en este rango.</div>') +
      '<div class="pie"><button type="button" ' + act("cerrar") + ">Cerrar</button></div>", true);

function cajaDia(cajera, dia) {

    var quien = "";

      '<div class="tile"><div class="v">' + f.leidas + "/" + f.capturas + '</div><div class="r">placa leída · sin pickups ' + f.leidas_sin_pu + "/" + f.capturas_sin_pu + "</div></div>" +

      "<dt>Canjes / 6to vendidos</dt><dd>" + f.canjes + " / " + f.sextos + (f.canjes === f.sextos ? ' <span class="chip verde">cuadra</span>' : ' <span class="chip rojo">no cuadra</span>') + "</dd>" +

function cajaSinTocarDia(cajera, dia) { cajaSinTocar(cajera, dia, dia); }
// Dias entre dos fechas AAAA-MM-DD (b - a).

// ---------------------------------------------------------------------
// FILTROS DE FECHA (Luis, 1/nov/2026): cambiar una fecha NO busca. Se editan
// las dos y "Aplicar" (o Enter en cualquiera de las dos) busca. Antes cada
// fecha buscaba sola: no dejaba tocar la segunda, y con el tope de dias el
// primer cambio ya chocaba (del 1/jun al 1/nov en Facturacion). Los atajos
// (Hoy, Este mes...) siguen aplicando al instante porque traen las dos fechas.
// Lo tecleado vive en RANGO_PEND hasta aplicar; se limpia al repintar las

// ---------------------------------------------------------------------
var RANGO_PEND = {};
function rangoHTML(pref, v, maxDias) {
  var hoy = hoyLocal(), ap = pref + "Aplicar";

    '<div class="campo"><label for="' + pref + '-hasta">al</label><input type="date" id="' + pref + '-hasta" value="' + h(v.hasta) + '" max="' + hoy + '" ' + on("change", "rangoFecha", pref, "hasta") + "></div>" +
    '<div class="campo"><button type="button" class="primario" ' + act(ap) + '>Aplicar</button><span class="nota">máx. ' + maxDias + " días</span></div>";
}
// Una fecha tecleada o escogida: se apunta, no se busca.
function rangoFecha(pref, campo, x) { if (!RANGO_PEND[pref]) RANGO_PEND[pref] = {}; RANGO_PEND[pref][campo] = x; }

// Las dos fechas a aplicar (lo apuntado o, si no se toco, lo que se ve), ya

  if (de > ha) { toast("El primer día tiene que ser antes que el segundo."); return null; }

  if (ha > hoyLocal()) { toast("La fecha final no puede pasar de hoy."); return null; }
  if (diasEntre(de, ha) > maxDias) { toast("El rango no puede pasar de " + maxDias + " días."); return null; }

var COM_MES = null, COM_CACHE = null, COM_MODAL = 0, COM_TARIFA_LISTO = null;

    else if (num(c.total) >= 0) { pendientes.push(c.cajera); porPagar += num(c.total); }   // un total negativo no se paga (B6)

  html = '<div class="fila entre"><div><h1>Comisiones</h1><div class="muted">Lo que gana cada cajera por lo que vende de más en el ticket: aromas, encerados, detallados. Unidades netas por la tarifa vigente el día de la venta; una devolución se le resta a quien vendió.</div></div></div>' + comControles(v);

    "</div>" +

    "</div>" +
    '<div class="tiles" style="margin-top:12px">' +
    '<div class="tile"><div class="v">' + h(pesos(d.total)) + '</div><div class="r">comisiones del mes</div></div>' +
    '<div class="tile ' + (porPagar > 0 && cerrado ? "ojo" : "") + '"><div class="v">' + h(pesos(porPagar)) + '</div><div class="r">por pagar · ' + pl(pendientes.length, "cajera", "cajeras") + "</div></div>" +
    '<div class="tile ' + (pagado > 0 ? "ok" : "") + '"><div class="v">' + h(pesos(pagado)) + '</div><div class="r">ya pagado</div></div>' +
    "</div></div>";

  if (num(d.ventas_sin_desglose) > 0) {
    html += '<div class="aviso rojo"><b>' + pl(num(d.ventas_sin_desglose), "venta", "ventas") + " sin desglose de productos</b> en este mes (el índice de la venta falló al entrar): no entran al cálculo. Están en la bitácora del webhook.</div>";
  }
  if (num(d.devoluciones_sin_original) > 0) {
    html += '<div class="aviso"><b>' + pl(num(d.devoluciones_sin_original), "devolución", "devoluciones") + " sin su venta original</b> en la base: se restó a quien la procesó y con la tarifa del día de la devolución, no a quien vendió. Va marcada en los renglones.</div>";
  }
  if ((d.sin_tarifa || []).length) {
    var st = "";
    for (i = 0; i < d.sin_tarifa.length; i++) {
      p = d.sin_tarifa[i];
      st += (i ? ", " : "") + "<b>" + h(p.producto) + "</b> ×" + h(num(p.unidades)) + (p.categoria ? ' <span class="muted chico-t">(' + h(p.categoria) + ")</span>" : "") +
            ' <button type="button" class="liso chico" ' + act("comTarifa", p.producto) + ">ponerle tarifa</button>";
    }
    html += '<div class="aviso"><b>Vendido este mes sin tarifa</b> (no se paga, pero no se esconde): ' + st + ".</div>";
  }

  if (!caj.length) {
    html += '<div class="card vacio">Nadie vendió nada con comisión en ' + h(mesTxt(v.mes)) + ".</div>";
  }
  for (i = 0; i < caj.length; i++) {
    c = caj[i];
    var filas = "";
    for (j = 0; j < (c.productos || []).length; j++) {
      p = c.productos[j];
      filas += "<tr><td>" + h(p.producto) + '</td><td class="num">' + h(num(p.vendidas)) + '</td><td class="num">' + (num(p.devueltas) ? '<span class="chip rojo">−' + h(num(p.devueltas)) + "</span>" : "—") +
               '</td><td class="num">' + h(pesos(p.tarifa)) + '</td><td class="num"><b>' + h(pesos(p.comision)) + "</b></td></tr>";
    }
    var estado, arrastre = "";
    if (c.pagado) {
      estado = c.pagado.arrastrado_a
        ? '<span class="chip verde">Se descontó de ' + h(c.pagado.arrastrado_a) + "</span>"
        : '<span class="chip verde">Pagado el ' + h(fmtFecha(c.pagado.pagado_en, false)) + " · " + h(c.pagado.quien) + "</span>" +
          (num(c.pagado.monto) !== num(c.total) ? ' <span class="chip ambar" title="Lo pagado no se reescribe. La diferencia es de un cambio posterior (una venta que entró tarde o una tarifa movida hacia atrás).">se pagó ' + h(pesos(c.pagado.monto)) + "; hoy el cálculo da " + h(pesos(c.total)) + "</span>" : "");
    } else if (num(c.total) < 0) {
      // Mini auditoria de la 215 (B6): un mes negativo no se paga; se descuenta del siguiente.
      estado = '<span class="chip rojo" title="Una devolución dejó el mes en negativo. No se paga: ese saldo se descuenta del mes siguiente.">saldo negativo · se descuenta del mes siguiente</span>';
    } else if (cerrado) {
      estado = '<button type="button" class="primario chico" ' + act("comPagar", v.mes, [c.cajera]) + ">Marcar como pagado…</button>";

    }
    html += '<div class="card"><div class="fila entre"><h2 style="margin:0">' + h(c.cajera) + '</h2><div class="fila"><span class="mono" style="font-size:26px;font-weight:800">' + h(pesos(c.total)) + "</span>" + estado + "</div></div>" + arrastre +
      '<div class="tabla-wrap" style="margin-top:10px"><table><thead><tr><th>Producto</th><th class="num">Vendidas</th><th class="num">Devueltas</th><th class="num">Tarifa</th><th class="num">Comisión</th></tr></thead><tbody>' + filas + "</tbody></table></div>" +
      '<div class="fila" style="margin-top:8px"><button type="button" class="liso chico" ' + act("comTickets", c.cajera) + ">Ver los " + pl((c.renglones || []).length, "renglón", "renglones") + " ticket por ticket</button></div></div>";
  }

  if ((d.monto_libre || []).length) {
    var ml = "";
    for (i = 0; i < d.monto_libre.length; i++) {
      p = d.monto_libre[i];
      ml += (i ? ", " : "") + "ticket " + h(p.ticket) + " " + h(pesos(p.monto)) + (p.producto ? " «" + h(p.producto) + "»" : "") + ' <span class="muted chico-t">(' + h(p.cajera) + ", " + h(diaCorto(p.dia)) + ")</span>";
    }
    html += '<div class="card"><div class="nota"><b>' + pl(d.monto_libre.length, "cobro de monto libre", "cobros de monto libre") + "</b> no comisionan: no traen nombre de producto, así que no se sabe qué fueron. " + ml + ". Si alguno era un detallado o un encerado, hay que cobrarlo con su producto.</div></div>";
  }

  // Tarifas vigentes
  var tf = "";
  for (i = 0; i < (d.tarifas || []).length; i++) {
    p = d.tarifas[i];
    tf += "<tr><td>" + h(p.producto) + '</td><td class="num">' + h(pesos(p.monto)) + "</td><td>" + h(fmtFecha(p.desde)) + '</td><td class="acc"><button type="button" class="chico" ' + act("comTarifa", p.producto) + ">Cambiar…</button></td></tr>";
  }
  html += '<div class="card"><div class="fila entre"><h2 style="margin:0">Tarifas vigentes</h2><button type="button" class="chico" ' + act("comTarifa", "") + ">Agregar producto…</button></div>" +
    (tf ? '<div class="tabla-wrap" style="margin-top:10px"><table><thead><tr><th>Producto</th><th class="num">Por unidad</th><th>Desde</th><th></th></tr></thead><tbody>' + tf + "</tbody></table></div>" : '<div class="vacio">No hay ninguna tarifa vigente.</div>') +
    '<div class="nota" style="margin-top:8px">Se casa por el nombre exacto del producto en Zettle, sin importar la variante. Cambiar una tarifa aplica desde la fecha que digas: con una fecha pasada, esos meses se recalculan (se avisa); lo ya pagado no se mueve. Si había una tarifa programada después de esa fecha, se reemplaza y la previa lo dice.</div>' +
    '<details style="margin-top:8px"><summary>Cómo se calcula</summary><dl class="kv" style="margin-top:8px;grid-template-columns:180px 1fr">' +
    "<dt>Fuente</dt><dd>Cada renglón del ticket de Zettle: producto, cantidad y la cajera que cobró (su usuario de Zettle). Un Pinito ×2 son dos comisiones.</dd>" +
    "<dt>Devoluciones</dt><dd>Se restan a quien <b>vendió</b> (no a quien procesó la devolución), con la tarifa del día de la venta, en el mes en que se devolvió. Así un mes ya pagado no cambia. Si la venta original no está en la base, se resta a quien la procesó y se avisa.</dd>" +
    "<dt>Mes negativo</dt><dd>Si una devolución deja a una cajera en negativo, ese mes no se paga: el saldo se descuenta del mes siguiente, y al pagar ése, el negativo queda marcado como descontado.</dd>" +
    "<dt>Tarifa</dt><dd>La vigente el día de la venta. Cambiarla aplica desde la fecha que digas; con una fecha pasada se recalculan esos meses y se avisa.</dd>" +
    "<dt>Fecha de pago</dt><dd>El primer martes <b>después</b> del último día del mes. Si el mes termina en martes, el martes siguiente.</dd>" +
    "<dt>Sin tarifa</dt><dd>Un producto de Aroma, Extras o Paquetes Especial vendido sin tarifa se avisa en vez de pagar cero en silencio. Con tarifa $0 deja de avisar.</dd>" +
    "<dt>Monto libre</dt><dd>Un cobro sin producto no comisiona: no se sabe qué fue.</dd>" +
    "<dt>Pagado</dt><dd>Al marcarlo se guarda el desglose tal como estaba. Queda en la bitácora y se puede deshacer.</dd>" +
    "</dl></details></div>";
  return html;
}

// Los renglones de una cajera, ticket por ticket, de lo ya bajado.
function comTickets(cajera) {
  if (!comCacheVigente(VISTA.mes)) { toast("Vuelve a cargar el mes"); return; }
  var caj = COM_CACHE.d.cajeras || [], c = null, i, r, filas = "";
  for (i = 0; i < caj.length; i++) if (caj[i].cajera === cajera) c = caj[i];
  if (!c) { toast("Esa cajera ya no está en el mes"); return; }
  for (i = 0; i < (c.renglones || []).length; i++) {
    r = c.renglones[i];
    filas += '<tr class="' + (r.devolucion ? "dev" : "") + '"><td>' + h(diaCorto(r.dia)) + " " + h(r.hora) + '</td><td class="mono">' + h(r.ticket) + "</td><td>" + h(r.producto) + (r.variante ? ' <span class="muted chico-t">' + h(r.variante) + "</span>" : "") +
             (r.devolucion ? ' <span class="chip rojo">devolución' + (r.ticket_original ? " del ticket " + h(r.ticket_original) : "") + "</span>" : "") +
             '</td><td class="num">' + h(num(r.cant)) + '</td><td class="num">' + h(pesos(r.tarifa)) + '</td><td class="num"><b>' + h(pesos(r.comision)) + "</b></td></tr>";
  }
  abrir("<h2>" + h(cajera) + " · " + h(mesTxt(COM_CACHE.mes)) + "</h2>" +
    '<p class="muted chico-t">Cada renglón con comisión, en el orden en que se cobró. El número de ticket es el de Zettle.</p>' +
    (filas ? '<div class="tabla-wrap"><table><thead><tr><th>Cuándo</th><th>Ticket</th><th>Producto</th><th class="num">Cant.</th><th class="num">Tarifa</th><th class="num">Comisión</th></tr></thead><tbody>' + filas + "</tbody></table></div>" : '<div class="vacio">Sin renglones.</div>') +
    '<div class="fila entre" style="margin-top:8px"><span class="mono"><b>Total ' + h(pesos(c.total)) + '</b></span><button type="button" class="primario" ' + act("cerrar") + ">Cerrar</button></div>", true);
}

// Marcar como pagado: una cajera o todas las pendientes del mes. Sin motivo
// (no toca datos de clientes); queda en la bitacora y se deshace.
function comPagar(ym, cajeras) {
  if (!esMes(ym) || !comCacheVigente(ym)) { toast("Vuelve a cargar el mes"); return; }
  var rg = mesRango(ym), caj = COM_CACHE.d.cajeras || [], partes = [], i, j, c;
  for (i = 0; i < cajeras.length; i++) for (j = 0; j < caj.length; j++) if (caj[j].cajera === cajeras[i]) {
    c = caj[j];
    if (num(c.total) < 0) { toast(c.cajera + " queda en " + pesos(c.total) + ": no se paga, se descuenta del mes siguiente"); return; }
    partes.push("<b>" + h(c.cajera) + " " + h(pesos(c.total)) + "</b>" + (num(c.arrastre) ? ' <span class="muted chico-t">(incluye ' + h(pesos(c.arrastre)) + " del mes anterior)</span>" : ""));
  }
  if (!partes.length) { toast("No hay a quién pagarle"); return; }
  abrirSimple("¿Marcar como pagado?", "Comisiones de <b>" + h(mesTxt(ym)) + "</b>: " + partes.join(", ") + ". Se guarda el desglose tal como está hoy. Queda en la bitácora y se puede deshacer.",
    "/comision-pagar", { desde: rg.desde, hasta: rg.hasta, cajeras: cajeras }, "Sí, ya se pagó");
}

// Cambiar o dar de alta una tarifa. El menu de productos lo da la base
// (vendidos en 180 dias en Aroma/Extras/Paquetes Especial + los que ya
// tienen tarifa). Dos pasos en el mismo modal: "Ver que cambia" corre la
// accion en ensayo y muestra el resumen y las advertencias; "Confirmar"
// la hace. Cualquier cambio en los campos vuelve al primer paso.
function comTarifa(producto) {
  var mi = ++COM_MODAL, token = TOKEN;
  COM_TARIFA_LISTO = null;
  pedirJSON("/comisiones-productos").then(function (d) {
    if (mi !== COM_MODAL || token !== TOKEN || VISTA.n !== "comisiones") return;
    var lista = listaDe(d, "productos"), ops = "", i, p, actual = null, hay = false;
    for (i = 0; i < lista.length; i++) {
      p = lista[i];
      if (producto && p.producto === producto) { hay = true; if (p.tarifa != null) actual = p.tarifa; }
      ops += '<option value="' + h(p.producto) + '"' + (producto && p.producto === producto ? " selected" : "") + ">" + h(p.producto) +
             (p.tarifa != null ? " · hoy " + h(pesos(p.tarifa)) : "") + (p.unidades ? " · " + h(num(p.unidades)) + " vendidos en 180 días" : "") + "</option>";
    }
    if (producto && !hay) ops += '<option value="' + h(producto) + '" selected>' + h(producto) + "</option>";
    ops = (producto ? "" : '<option value="">Elige un producto…</option>') + ops + '<option value="__otro">Otro (escribir el nombre)…</option>';
    abrir("<h2>" + (producto ? "Cambiar tarifa" : "Tarifa nueva") + "</h2>" +
      '<div class="form">' +
      '<div class="campo"><label for="ct-prod">Producto (tal como está en Zettle)</label><select id="ct-prod" ' + on("change", "comTarifaProd") + ">" + ops + '</select><input id="ct-otro" type="text" placeholder="Nombre exacto del producto en Zettle" hidden ' + on("input", "comTarifaCambio") + "></div>" +
      '<div class="campo"><label for="ct-monto">Comisión por unidad (pesos)</label><input id="ct-monto" type="number" min="0" step="1" inputmode="numeric" value="' + (actual != null ? h(actual) : "") + '" ' + on("input", "comTarifaCambio") + "></div>" +
      '<div class="campo"><label for="ct-desde">Aplica desde</label><input id="ct-desde" type="date" value="' + h(hoyLocal().slice(0, 8) + "01") + '" ' + on("change", "comTarifaCambio") + "></div>" +
      '<div class="campo"><label for="ct-nota">Nota (opcional)</label><input id="ct-nota" type="text" placeholder="Por qué cambia"></div>' +
      '<div id="ct-prev"></div>' +
      '<div class="muted chico-t">Con $0 el producto deja de comisionar. Lo ya pagado no cambia; lo que se vendió antes de la fecha conserva su tarifa.</div>' +
      '</div><div class="pie"><button type="button" ' + act("cerrar") + '>Cancelar</button><button type="button" class="primario" id="ct-ok" ' + act("comTarifaGuardar") + ">Ver qué cambia</button></div>");
  }, function (e) { if (e.message !== "codigo") toast("No se pudo consultar: " + (e.message || e)); });
}
function comTarifaProd(val) { var o = $("#ct-otro"); if (o) { o.hidden = val !== "__otro"; if (!o.hidden) o.focus(); } comTarifaCambio(); }
function comTarifaCambio() {
  COM_TARIFA_LISTO = null;
  var ok = $("#ct-ok"), prev = $("#ct-prev");
  if (ok) { ok.textContent = "Ver qué cambia"; ok.disabled = false; }
  if (prev) prev.innerHTML = "";
}
function comTarifaCuerpo() {
  var sel = $("#ct-prod"), otro = $("#ct-otro"), monto = $("#ct-monto"), desde = $("#ct-desde"), nota = $("#ct-nota");
  if (!sel || !monto || !desde) return null;
  var producto = sel.value === "__otro" ? recortar(otro ? otro.value : "") : sel.value;
  if (!producto) { toast("Falta el producto"); return null; }
  var m = recortar(monto.value);
  if (m === "" || isNaN(Number(m)) || Number(m) < 0) { toast("La tarifa tiene que ser un monto de cero o más"); monto.focus(); return null; }
  if (!esFecha(desde.value)) { toast("Falta desde qué día aplica"); desde.focus(); return null; }
  return { producto: producto, monto: Number(m), desde: desde.value, nota: nota ? recortar(nota.value) : "" };
}
function comPreviaTarifa(r) {
  var html = "", adv = r.advertencias || [], i;
  for (i = 0; i < adv.length; i++) html += '<div class="aviso" style="margin-bottom:8px">' + h(adv[i]) + "</div>";
  html += '<div class="prev"><div class="ant"><div class="muted chico-t">Hoy</div><div class="n">' + (r.monto_antes != null ? h(pesos(r.monto_antes)) : "sin tarifa") + '</div></div><div class="fl">→</div><div class="des"><div class="muted chico-t">Desde el ' + h(fmtFecha(r.desde)) + '</div><div class="n">' + h(pesos(r.monto)) + "</div></div></div>" +
          '<div class="muted chico-t" style="margin-top:8px">' + h(r.resumen || "") + " · Vista previa: no se guardó nada todavía.</div>";
  return html;
}
function comTarifaGuardar() {
  var cuerpo = comTarifaCuerpo(); if (!cuerpo) return;
  var ok = $("#ct-ok"), prev = $("#ct-prev"), mi = ++COM_MODAL;
  if (!ok || !prev) return;
  // La nota no cambia lo que la accion hace: editarla despues de la previa
  // no obliga a ensayar otra vez (mini auditoria de la 215, P2).
  var listo = COM_TARIFA_LISTO && JSON.stringify(mezclar(COM_TARIFA_LISTO, { nota: "" })) === JSON.stringify(mezclar(cuerpo, { nota: "" }));
  ok.disabled = true; ok.textContent = listo ? "Guardando…" : "Calculando…";
  accion("/comision-tarifa", listo ? cuerpo : mezclar(cuerpo, { ensayo: true })).then(function (r) {
    if (mi !== COM_MODAL || !$("#ct-ok")) { if (listo && r.ok) { toast(r.resumen || "Listo"); render(); } return; }
    ok.disabled = false;
    if (!r.ok) { prev.innerHTML = pintarPrevia(r); COM_TARIFA_LISTO = null; ok.textContent = "Ver qué cambia"; return; }
    if (listo) { toast(r.resumen || "Listo"); cerrar(); render(); return; }
    prev.innerHTML = comPreviaTarifa(r); COM_TARIFA_LISTO = cuerpo; ok.textContent = "Confirmar";
  }, function (e) {
    if (e && e.message === "codigo") return;
    if (mi !== COM_MODAL || !$("#ct-ok")) return;
    prev.innerHTML = errorHTML(e); ok.disabled = false; ok.textContent = listo ? "Confirmar" : "Ver qué cambia";
  });
}

// ---------------------------------------------------------------------
// FACTURACION: la autofacturacion de la pagina web (migracion 235, 31/oct/2026).
// Solo informativa y solo para el perfil del dueno (la funcion rechaza sus
// rutas a cualquier otro). Lista que tickets se facturaron, a que cliente y a
// que correo, con dos botones: reenviar la factura y enviarla a otro correo.
// Generar, cancelar o editar una factura se queda en Alegra (la contadora).
// Lo que Alegra no le dice a nadie (reembolso despues de facturar, correo que
// no salio, cobro no registrado) va como etiqueta en la fila.
// ---------------------------------------------------------------------
var VE_FAC = false;            // lo dice /motivos (admin_quienes.ve_facturacion)
var FAC_FALLIDAS = false, FAC_RANGO = null, FAC_MODAL = 0, FAC_CACHE = {};
var FAC_ESTADO = { timbrada: ["Timbrada", "verde"], borrador: ["Borrador sin timbre", "ambar"], cancelada: ["Cancelada", ""], error: ["Intento fallido", "rojo"], descartada: ["Descartada", ""] };
var FAC_MOTIVO = {
  sat_rechazo: "El SAT rechazó el timbre", factura_rechazada: "Alegra no creó la factura", pago_rechazado: "Alegra rechazó el cobro",
  pago_no_registrado: "Cobro no registrado en Alegra", correo_no_enviado: "El correo no salió", borrador_sobrante: "Borrador de más en Alegra",
  reembolso_facturado: "Reembolso de una venta facturada", factura_descartada: "Factura descartada", total_no_cuadra: "El total no cuadró",
  no_cuadra: "El total no cuadró", sin_timbre: "Quedó sin timbre", alegra_caida: "Alegra no contestó", articulo_sin_mapear: "Artículo sin mapear",
  sin_id_de_retencion: "Falta la retención en el servidor", cancelada_en_alegra: "Cancelada en Alegra", sincronizacion_fallo: "No se pudo leer Alegra",
  no_puede_arrancar: "Falta un secreto en el servidor", intento_sin_terminar: "Un intento no terminó", timbrada_sin_fila: "Timbrada en Alegra sin registro web",
  cancelada_no_libera: "Cancelada: el ticket no se libera", contacto_no_restaurado: "El contacto no volvió a sus datos", numeracion_atrasada: "La numeración W va atrasada", timbrada_conciliada: "Timbrada en Alegra: fila conciliada", intento_cortado: "La llamada a Alegra se cortó", numeracion_mal_configurada: "La numeración de Alegra está mal configurada"
};
// alegra_<status> (alegra_500, alegra_429…) lo deja facturar cuando Alegra contesta algo inesperado.
function facMotivo(m) {
  if (FAC_MOTIVO[m]) return FAC_MOTIVO[m];
  if (/^alegra_[0-9]{3}$/.test(String(m))) return "Alegra contestó " + String(m).slice(7);
  return String(m || "Aviso");
}

function vFacturacion(v, pinta) {
  if (!VE_FAC) { VISTA = { n: "bandeja" }; render(); return; }
  if (!esFecha(v.desde) || !esFecha(v.hasta)) {
    if (FAC_RANGO) { v.desde = FAC_RANGO.desde; v.hasta = FAC_RANGO.hasta; v.preset = FAC_RANGO.preset; }
    else { var hoy = hoyLocal(); v.hasta = hoy; v.desde = hoy.slice(0, 8) + "01"; v.preset = "mes"; }
  }
  FAC_RANGO = { desde: v.desde, hasta: v.hasta, preset: v.preset };
  pinta(cargando());
  pedirJSON("/facturas?desde=" + encodeURIComponent(v.desde) + "&hasta=" + encodeURIComponent(v.hasta) + (FAC_FALLIDAS ? "&fallidas=1" : "")).then(function (d) {
    if (!d || !Array.isArray(d.facturas)) { pinta(facControles(v) + errorHTML("La respuesta no trae las facturas.")); return; }
    pinta(facHTML(v, d));
  }, function (e) { if (e.message !== "codigo") pinta(facControles(v) + errorHTML(e)); });
}

function facControles(v) {
  var hoy = hoyLocal();
  var presets = [["mes", "Este mes"], ["ant", "Mes pasado"], ["7", "Últimos 7 días"], ["30", "Últimos 30 días"], ["hoy", "Hoy"]];
  var html = '<div class="card"><div class="rango">' +
    rangoHTML("fac", v, RANGO_MAX.fac) +
    '<div class="presets">';
  for (var i = 0; i < presets.length; i++) html += '<button type="button" class="chico ' + (v.preset === presets[i][0] ? "on" : "") + '" ' + act("facPreset", presets[i][0]) + ">" + presets[i][1] + "</button>";
  html += "</div>" +
    '<label class="interruptor" style="margin-left:auto"><input type="checkbox" id="fac-fallidas" ' + (FAC_FALLIDAS ? "checked" : "") + " " + on("change", "facFallidas") + "> Ver también los intentos fallidos</label>" +
    "</div></div>";
  return html;
}

function facNumero(f) { return f.numero ? (f.serie ? h(f.serie) + "-" : "") + h(f.numero) : "sin número"; }
// La llave de una fila: el id de `facturas` (la web) o "a:<id de Alegra>" (la contadora, 236).
function facClave(f) { return f.origen === "alegra" ? "a:" + f.alegra_id : f.id; }
function facTitulo(f) {
  if (!f) return "esta factura";
  var t = f.tickets || (f.ticket != null ? [f.ticket] : []);
  var num = f.numero ? " (" + (f.serie ? f.serie + "-" : "") + f.numero + ")" : "";
  if (!t.length) return "factura" + (f.numero ? " " + (f.serie ? f.serie + "-" : "") + f.numero : "");
  return (t.length > 1 ? "tickets " : "ticket ") + t.join(", ") + num;
}

function facFila(f) {
  var est = FAC_ESTADO[f.estado] || [f.estado, ""], i;
  // Quien la hizo (236): la pagina web (Claude, serie W) o la contadora en Alegra.
  var chips = (f.origen === "alegra" ? '<span class="chip morado">Alegra</span> ' : '<span class="chip cian">Claude</span> ') +
              '<span class="chip ' + est[1] + '">' + h(est[0]) + "</span>";
  if (f.sin_ticket) chips += ' <span class="chip ambar">Sin recibo en la factura</span>';
  if (f.reembolsada_en) chips += ' <span class="chip rojo">Reembolsada después de facturar · ' + h(pesos(f.reembolso_monto)) + "</span>";
  if (f.correo_no_salio) chips += ' <span class="chip ambar">El correo no salió</span>';
  if (f.cobro_no_registrado) chips += ' <span class="chip ambar">Cobro no registrado en Alegra</span>';
  var envios = f.envios || [], env = "";
  for (i = 0; i < envios.length; i++) {
    var e = envios[i];
    env += '<div class="chico-t' + (e.ok ? " muted" : "") + '"' + (e.ok ? "" : ' style="color:var(--rojo)"') + ">" +
      (e.ok ? "Enviada a " : "No se pudo enviar a ") + h(e.correo) + " · " + fmtFecha(e.en) + " · " + h(e.quien) + (e.ok ? "" : " · " + h(e.error || "")) + "</div>";
  }
  var avisos = f.avisos || [], av = "";
  if (avisos.length) {
    av = '<details style="margin-top:6px"><summary class="chico-t">' + pl(avisos.length, "aviso de este ticket", "avisos de este ticket") + "</summary>";
    for (i = 0; i < avisos.length; i++) av += '<div class="chico-t muted" style="margin-top:4px"><b>' + h(facMotivo(avisos[i].motivo)) + "</b> · " + fmtFecha(avisos[i].en) + "<br>" + h(avisos[i].detalle) + "</div>";
    av += "</details>";
  }
  var clave = facClave(f);
  // Reenviar va al correo guardado: una de la contadora sin correo en Alegra
  // solo ofrece "Enviar a otro correo".
  var botones = f.puede_enviar
    ? '<div class="fila" style="gap:8px">' + (f.correo ? '<button type="button" class="chico" ' + act("facReenviar", clave) + ">Reenviar factura</button>" : "") +
      '<button type="button" class="chico" ' + act("facOtroCorreo", clave) + ">Enviar a otro correo</button></div>"
    : "";
  var tks = f.tickets || (f.ticket != null ? [f.ticket] : []);
  // Cada ticket es un enlace a su detalle (lo mismo que el modal de la
  // pestaña Tickets del reporte). Pedido del dueño, 2/nov/2026.
  // Sin ticket el titulo es solo "Factura": el numero ya va grande al lado
  // (si se repitiera aqui saldria "Factura 497 497").
  var titulo = tks.length ? (tks.length > 1 ? "Tickets " : "Ticket ") + facTicketsHTML(tks) : "Factura";
  var importe = f.monto != null
    ? h(pesos(f.monto)) + (f.total != null && Number(f.total) !== Number(f.monto) ? ' <span class="muted chico-t">(total de la factura ' + h(pesos(f.total)) + (f.retencion ? ", retención " + h(pesos(f.retencion)) : "") + ")</span>" : "")
    : (f.total != null ? "total " + h(pesos(f.total)) : "");
  return '<div class="item" style="align-items:flex-start">' +
    '<div style="min-width:0;flex:1">' +
      // El numero de la factura va grande y en negrita (pedido del dueño,
      // 2/nov/2026: "se pierde en la fecha"). Sin numero (intento fallido)
      // sigue en gris chico: no hay nada que resaltar.
      '<div class="fila" style="gap:8px"><b>' + titulo + "</b>" + (f.numero ? '<span class="fac-num">' + facNumero(f) + "</span>" : '<span class="muted chico-t">' + facNumero(f) + "</span>") + '<span class="muted chico-t">' + fmtFecha(f.fecha) + "</span> " + chips + "</div>" +
      "<div>" + h(f.nombre || "—") + ' <span class="muted chico-t">' + h(f.rfc || "") + "</span>" + (importe ? " · " + importe : "") + "</div>" +
      '<div class="chico-t">Correo: ' + (f.correo ? "<b>" + h(f.correo) + "</b>" : '<span class="muted">sin correo en Alegra</span>') + (f.enviado_en ? ' <span class="muted">· enviada al facturar, ' + fmtFecha(f.enviado_en) + "</span>" : "") + "</div>" +
      env +
      (f.error && f.estado !== "timbrada" ? '<div class="chico-t" style="color:var(--rojo)">' + h(f.error) + "</div>" : "") +
      av +
    "</div>" + botones + "</div>";
}

function facHTML(v, d) {
  var F = d.facturas || [], R = d.resumen || {}, S = d.avisos_sueltos || [], i;
  FAC_CACHE = {};
  for (i = 0; i < F.length; i++) FAC_CACHE[facClave(F[i])] = F[i];
  var html = '<div class="fila entre"><div><h1>Facturación</h1><div class="muted">Las facturas de Alegra: las que pidieron los clientes en la página web (<b>Claude</b>) y las que hace la contadora (<b>Alegra</b>). Es sólo informativa: generar, cancelar o editar una factura se hace en Alegra, donde la atiende la contadora.</div></div>' +
    (R.sincronizado_en ? '<span class="muted chico-t">Alegra leído ' + fmtFecha(R.sincronizado_en) + "</span>" : "") + "</div>" + facControles(v);
  html += '<div class="tiles">' +
    '<div class="tile"><div class="v">' + (R.timbradas || 0) + '</div><div class="r">facturas timbradas · Claude ' + (R.timbradas_claude || 0) + " · Alegra " + (R.timbradas_alegra || 0) + "</div></div>" +
    '<div class="tile"><div class="v">' + h(pesos(R.total)) + '</div><div class="r">total facturado (timbradas)</div></div>' +
    '<div class="tile ' + (R.sin_ticket ? "ojo" : "ok") + '"><div class="v">' + (R.sin_ticket || 0) + '</div><div class="r">de la contadora sin recibo</div></div>' +
    '<div class="tile"><div class="v">' + (R.canceladas || 0) + '</div><div class="r">canceladas</div></div>' +
    '<div class="tile ' + (R.reembolsadas ? "ojo" : "ok") + '"><div class="v">' + (R.reembolsadas || 0) + '</div><div class="r">reembolsadas después de facturar</div></div>' +
    '<div class="tile ' + (R.correo_no_salio ? "ojo" : "ok") + '"><div class="v">' + (R.correo_no_salio || 0) + '</div><div class="r">con el correo sin salir</div></div>' +
    '<div class="tile ' + (R.fallidos ? "ojo" : "ok") + '"><div class="v">' + (R.fallidos || 0) + '</div><div class="r">intentos fallidos' + (R.fallidos && !FAC_FALLIDAS ? " (ocultos)" : "") + "</div></div>" +
    "</div>";
  if (S.length) {
    var s = "";
    for (i = 0; i < S.length; i++) s += '<div class="item"><div style="min-width:0;flex:1"><b>' + h(facMotivo(S[i].motivo)) + "</b>" + (S[i].ticket ? ' <span class="muted chico-t">ticket ' + facTicketsHTML([S[i].ticket]) + "</span>" : "") +
      ' <span class="muted chico-t">· ' + fmtFecha(S[i].en) + (S[i].veces > 1 ? " · " + h(S[i].veces) + " veces" : "") + '</span><div class="chico-t muted">' + h(S[i].detalle) + "</div></div></div>";
    html += '<div class="card"><div class="fila entre"><h2>Avisos de facturación</h2><span class="nota">De tickets que no salen en la lista de abajo' + (FAC_FALLIDAS ? "" : " (o de intentos fallidos ocultos)") + "</span></div>" + s + "</div>";
  }
  if (!F.length) return html + '<div class="card vacio">No hay facturas entre el ' + fmtFecha(v.desde) + " y el " + fmtFecha(v.hasta) + "." + (R.fallidos && !FAC_FALLIDAS ? " Hay " + pl(R.fallidos, "intento fallido", "intentos fallidos") + ": prende \"Ver también los intentos fallidos\"." : "") + "</div>";
  var filas = "";
  for (i = 0; i < F.length; i++) filas += facFila(F[i]);
  html += '<div class="card"><div class="fila entre"><h2>' + pl(F.length, "factura", "facturas") + '</h2><span class="nota">La más reciente arriba</span></div>' + filas + "</div>";
  return html;
}

function facPreset(k) {
  var hoy = hoyLocal(), primero = hoy.slice(0, 8) + "01";
  if (k === "mes") { VISTA.desde = primero; VISTA.hasta = hoy; }
  if (k === "ant") { VISTA.hasta = sumarDias(primero, -1); VISTA.desde = VISTA.hasta.slice(0, 8) + "01"; }
  if (k === "7") { VISTA.desde = sumarDias(hoy, -6); VISTA.hasta = hoy; }
  if (k === "30") { VISTA.desde = sumarDias(hoy, -29); VISTA.hasta = hoy; }
  if (k === "hoy") { VISTA.desde = hoy; VISTA.hasta = hoy; }
  VISTA.preset = k; render();
}
function facFallidas(valor) { FAC_FALLIDAS = !FAC_FALLIDAS; render(); }

// Los dos envios abren un modal; la respuesta solo lo toca si ese modal sigue
// abierto (FAC_MODAL), y la lista se recarga para que salga el envio nuevo.
function facReenviar(id) {
  var f = FAC_CACHE[id];
  FAC_MODAL++;
  abrir("<h2>Reenviar factura</h2><p>Se vuelve a mandar la factura (" + h(facTitulo(f)) + ")" + (f && f.correo ? " a <b>" + h(f.correo) + "</b>" : " al correo guardado") + ".</p>" +
    '<div id="fac-res"></div><div class="pie"><button type="button" ' + act("cerrar") + '>Cancelar</button><button type="button" class="primario" id="fac-ok" ' + act("facEnviar", id, false) + ">Reenviar</button></div>");
}
function facOtroCorreo(id) {
  var f = FAC_CACHE[id];
  FAC_MODAL++;
  abrir("<h2>Enviar a otro correo</h2><p>La factura (" + h(facTitulo(f)) + ") se manda una vez a este correo. El correo guardado" + (f && f.correo ? " (" + h(f.correo) + ")" : "") + " y su contacto en Alegra no cambian.</p>" +
    '<div class="form"><div class="campo"><label for="fac-correo">Correo</label><input id="fac-correo" type="email" autocomplete="off" placeholder="nombre@ejemplo.com"></div></div>' +
    '<div id="fac-res"></div><div class="pie"><button type="button" ' + act("cerrar") + '>Cancelar</button><button type="button" class="primario" id="fac-ok" ' + act("facEnviar", id, true) + ">Enviar</button></div>");
}
function facEnviar(id, otro) {
  // "a:<id>" es una factura de la contadora (236); un numero, una de la web.
  var ok = $("#fac-ok"), res = $("#fac-res");
  var cuerpo = String(id).indexOf("a:") === 0 ? { alegra: String(id).slice(2) } : { id: id };
  if (otro) {
    var campo = $("#fac-correo"), c = campo ? String(campo.value || "") : "";
    c = c.replace(/^\s+|\s+$/g, "");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)) { if (res) res.innerHTML = '<div class="aviso rojo">Ese correo no parece válido.</div>'; return; }
    cuerpo.correo = c;
  }
  var mi = FAC_MODAL;
  if (ok) { ok.disabled = true; ok.textContent = "Enviando…"; }
  if (res) res.innerHTML = "";
  accion("/factura-enviar", cuerpo).then(function (d) {
    var sigue = mi === FAC_MODAL && !!$("#fac-ok");
    // La lista se recarga en los dos casos: el intento (salga o no) queda
    // anotado en la fila. render() no toca el modal.
    if (VISTA.n === "facturacion") render();
    if (d && d.ok) {
      if (sigue) cerrar();
      toast("Factura enviada a " + d.correo);
      return;
    }
    if (!sigue) { toast("No se envió: " + ((d && d.error) || "error")); return; }
    if (res) res.innerHTML = '<div class="aviso rojo">' + h((d && d.error) || "No se envió.") + "</div>";
    if (ok) { ok.disabled = false; ok.textContent = "Intentar otra vez"; }
  }, function (e) {
    if (e && e.message === "codigo") return;
    if (mi !== FAC_MODAL || !$("#fac-ok")) { toast("No se pudo enviar: " + (e.message || e)); return; }
    if (res) res.innerHTML = '<div class="aviso rojo">' + h(e.message || e) + "</div>";
    if (ok) { ok.disabled = false; ok.textContent = "Intentar otra vez"; }
  });
}

// --- El detalle de un ticket (pedido del dueño, 2/nov/2026) ----------------
// El número de ticket de cada factura abre un modal con lo que ya se sabe
// del ticket: la MISMA información que el modal de la pestaña Tickets del
// reporte (ticket_detalle: fecha, cajera, pago, cliente ligado, productos,
// descuentos, total), más lo que el panel ya traía para "Agregar visita"
// (carro, nota de la cajera, si está cancelado). No hay ruta nueva: es la
// misma /venta de la función admin (admin_venta_por_ticket, migración 194).
function facTicketsHTML(tks) {
  var s = "";
  for (var i = 0; i < tks.length; i++) {
    if (i) s += ", ";
    s += '<button type="button" class="enlace" ' + act("facVerTicket", tks[i]) + ">" + h(tks[i]) + "</button>";
  }
  return s;
}
// La marca como la manda Zettle (AMERICAN_EXPRESS, VISA_ELECTRON) en algo
// legible; lo que no se conoce sale tal cual, con espacios. Igual que en el reporte.
function facMarcaTxt(m) {
  if (!m) return "";
  var conocidas = { AMERICAN_EXPRESS: "AMEX", MASTERCARD: "Mastercard", VISA: "VISA", VISA_ELECTRON: "VISA Electron", DINERS: "Diners" };
  return conocidas[m] || String(m).replace(/_/g, " ");
}
// El pago, desde `pago_detalle` (179): "Tarjeta de crédito AMEX · terminación
// 1234", o "Efectivo · recibió $200, cambio $20". Sin detalle (archivo viejo)
// cae al texto crudo de Zettle.
function facPagoTxt(t) {
  var d = t.pago_detalle;
  if (!d || !d.tipo) {
    var p = t.pago;
    if (!p) return "—";
    if (String(p).indexOf("CASH") >= 0) return "Efectivo";
    if (String(p).indexOf("CARD") >= 0) return "Tarjeta";
    return String(p);
  }
  if (d.tipo === "tarjeta") {
    var s = d.clase === "credito" ? "Tarjeta de crédito" : d.clase === "debito" ? "Tarjeta de débito" : "Tarjeta";
    if (d.marca) s += " " + facMarcaTxt(d.marca);
    if (d.ultimos4) s += " · terminación " + d.ultimos4;
    return s;
  }
  if (d.tipo === "efectivo") {
    var e = "Efectivo";
    if (d.recibido != null) e += " · recibió " + pesos(d.recibido);
    if (d.cambio != null && Number(d.cambio) > 0) e += ", cambio " + pesos(d.cambio);
    return e;
  }
  return String(d.tipo);
}
// "JUAN PEREZ" -> "Juan Perez", como lo pinta el reporte.
function facNombre(s) {
  if (s == null) return "";
  return String(s).toLowerCase().replace(/(^|[\s'.\-])([a-záéíóúüñ])/g, function (_, sep, ch) { return sep + ch.toUpperCase(); });
}
function facVerTicket(num) {
  FAC_MODAL++;
  var mi = FAC_MODAL;
  abrir("<h2>Ticket " + h(num) + "</h2>" + cargando("Buscando el ticket en Zettle…") + '<div class="pie"><button type="button" ' + act("cerrar") + ">Cerrar</button></div>");
  pedirJSON("/venta?ticket=" + encodeURIComponent(num)).then(function (d) {
    // Una respuesta tardía no pisa otro modal ni reabre uno ya cerrado.
    var fondo = $("#modal-fondo");
    if (mi !== FAC_MODAL || (fondo && fondo.hidden)) return;
    abrir(facTicketHTML(num, d ? d.venta : null));
  }, function (e) {
    if (e && e.message === "codigo") return;
    var fondo = $("#modal-fondo");
    if (mi !== FAC_MODAL || (fondo && fondo.hidden)) return;
    abrir(facTicketHTML(num, null, (e && e.message) || "error"));
  });
}
// Cerrar el modal y abrir la ficha del cliente ligado al ticket.
function facIrCliente(id) { cerrar(); ir({ n: "ficha", id: id }); }
// `fallo`: la consulta NO contestó. Se distingue de `t` nulo, que es la
// respuesta buena de "ese ticket no está en Zettle" (lección del reporte, 11/oct).
function facTicketHTML(num, t, fallo) {
  var pie = '<div class="pie"><button type="button" ' + act("cerrar") + ">Cerrar</button></div>";
  if (fallo) {
    return "<h2>Ticket " + h(num) + "</h2>" +
      '<div class="aviso rojo"><b>No se pudo consultar el ticket.</b> Esto <b>no</b> quiere decir que no exista: la consulta falló (' + h(fallo) + "). Intenta otra vez.</div>" + pie;
  }
  if (!t) {
    return "<h2>Ticket " + h(num) + "</h2>" +
      '<div class="muted">No se encontró en Zettle (puede ser anterior a sep-2025, o un ticket mal anotado).</div>' + pie;
  }
  var html = "<h2>Ticket " + h(t.ticket != null ? t.ticket : num) + (t.cancelado ? ' <span class="chip rojo">Cancelado (devolución)</span>' : "") + "</h2>";
  html += '<div class="venta">';
  html += "<div><b>Fecha</b>" + fmtFecha(t.hora) + "</div>";
  html += "<div><b>Cajera</b>" + h(t.cajero || "—") + "</div>";
  html += "<div><b>Pago</b>" + h(facPagoTxt(t)) + "</div>";
  // El cliente ligado (180): clicable a su ficha. Sin visita se dice, para
  // que "no aparece" no se lea como "falló".
  html += "<div><b>Cliente</b>" + (t.cliente_id != null
    ? '<button type="button" class="enlace" ' + act("facIrCliente", t.cliente_id) + ">" + h(facNombre(t.cliente)) + "</button>"
    : '<span class="muted">sin asignar a ningún cliente</span>') + "</div>";
  html += "<div><b>Carro</b>" + (t.carro_id ? "#" + h(t.carro_id) : '<span class="muted">sin carro (archivo)</span>') + "</div>";
  html += "<div><b>Nota de la cajera</b>" + (t.nota ? "«" + h(t.nota) + "»" : "—") + "</div>";
  html += "</div>";
  var prods = t.productos || [], descs = t.descuentos || [], i;
  html += '<h2 style="margin-top:14px">Productos</h2>';
  if (prods.length) {
    html += "<table>";
    for (i = 0; i < prods.length; i++) {
      var p = prods[i], nom = p.nombre ? String(p.nombre) : "";
      if (p.variante) nom += (nom ? " / " : "") + String(p.variante);
      html += "<tr><td>" + h(nom || "—") + '</td><td class="num">' + (p.cantidad != null ? "×" + h(p.cantidad) : "") + '</td><td class="num">' + (p.precio != null ? h(pesos(p.precio)) : "") + "</td></tr>";
    }
    html += "</table>";
  } else html += '<div class="muted">—</div>';
  if (descs.length) {
    html += '<h2 style="margin-top:14px">Descuentos</h2><table>';
    for (i = 0; i < descs.length; i++) html += "<tr><td>" + h(descs[i].nombre || "—") + '</td><td class="num">−' + h(pesos(descs[i].monto)) + "</td></tr>";
    html += "</table>";
  }
  html += '<div style="margin-top:12px;font-size:18px">Total: <b>' + h(pesos(t.monto)) + "</b></div>";
  return html + pie;
}

// =====================================================================
// EL REPORTE DEL DUEÑO, DENTRO DEL PANEL (243, 2/nov/2026)
//
// reporte.html deja de existir: sus cinco pestañas viven aqui, con las
// mismas RPC de siempre servidas por la funcion `admin` (una sola puerta:
// el codigo del panel y quien entra). Lo que cambio de diseño lo aprobo el
// dueño con el prototipo (reporte-al-panel/prototipo.html): Operacion con
// rango y atajos, cinco numeros con tendencia de 30 dias, "por equipo" con
// chips, refresco solo en "Hoy"; Trabajadores con la tabla por persona y
// periodo y el resumen del filtro en el perfil; Tickets y Flotillas tal
// cual; y en Clientes lo que el reporte tenia y el panel no (vehiculos por
// marca/modelo, ultimos lavados, perfil de placa con galeria, placas que
// mas han venido).
//
// Ningun calculo vive aqui: todo lo da la base. Sin metodos de arreglo, ni
// trim, ni Object.assign: los arneses JScript (pruebas/panel-operacion.sh,
// panel-trabajadores.sh, panel-tickets.sh, panel-flotillas.sh) ejecutan
// estos bloques con el interprete de Windows (ES3).
// =====================================================================

// --- piezas compartidas por las pestañas del reporte ------------------
// "34 min" / "1 h 5 min" desde segundos. Los segundos crudos no le dicen nada a nadie.
function duracion(seg) {
  if (seg == null) return "—";
  var m = Math.round(seg / 60);
  if (m < 60) return m + " min";
  var hh = Math.floor(m / 60);
  return hh + " h " + (m % 60) + " min";
}
// Solo la hora (HH:MM) en Mexicali; sin Intl (JScript), la del aparato.
function horaTxt(iso) {
  if (!iso) return "—";
  var d = iso instanceof Date ? iso : new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  try { return new Intl.DateTimeFormat("es-MX", { timeZone: "America/Tijuana", hour: "2-digit", minute: "2-digit", hour12: false }).format(d); }
  catch (e) { return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
}
// La descripcion de un carro: con modelo (la foto reconocio submarca) marca +
// submarca + color; sin el, lo que puso la cajera (tipo + color + marca).
function descCarro(c) {
  var p = [];
  if (c.submarca) { if (c.marca) p.push(c.marca); p.push(c.submarca); if (c.color) p.push(c.color); }
  else { if (c.tipo_unidad) p.push(c.tipo_unidad); if (c.color) p.push(c.color); if (c.marca) p.push(c.marca); }
  return facNombre(p.join(" "));
}

function enlaceTicket(t) { return t ? "<a " + act("facVerTicket", t) + ">" + h(t) + "</a>" : '<span class="tenue">—</span>'; }

// ---------------------------------------------------------------------
// OPERACION: el reporte del dia o del rango (reporte_del_rango), con la

// Los avisos del sistema y las placas atajadas NO van aqui: ya viven en
// Pendientes, y dos lugares para la misma alerta es como se dejan de leer.
// "Hoy" se refresca solo cada minuto: en un escritorio que se deja abierto,
// un numero viejo tiene cara de actual.

function opControles(v) {

}

// Una serie de 30 dias como linea de 2 px con area tenue y el ultimo punto
// marcado. Sin ejes: el numero grande de arriba ES el valor; la linea solo

function opRespaldo() {
  var boton = $("#op-respaldo"); if (!boton || boton.disabled) return;
  var textoOriginal = boton.textContent; boton.disabled = true;
  function avisar(t) { boton.textContent = t; }
  function pedirPagina(ruta) {
    return pedir(ruta, { corteMs: 120000 }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })

  }

    if (!man.tablas || !man.tablas.length) throw new Error("el manifiesto vino vacío");
    var total = 0, i;
    for (i = 0; i < man.tablas.length; i++) total += man.tablas[i].filas;
    var partes = ['{\n"generado_en":' + JSON.stringify(man.generado_en) + ',\n"manifiesto":' + JSON.stringify(man) + ',\n"datos":{'], bajadas = 0;
    function tabla(idx) {

      var t = man.tablas[idx], primera = true;
      partes.push((idx ? "," : "") + "\n" + JSON.stringify(t.tabla) + ":[");
      function pagina(desde) {

          for (var j = 0; j < filas.length; j++) { partes.push((primera ? "" : ",") + JSON.stringify(filas[j])); primera = false; }
          bajadas += filas.length;
          avisar("Bajando… " + Math.round(100 * bajadas / (total || 1)) + "%");
          if (d.siguiente === null || d.siguiente === undefined) return;
          return pagina(d.siguiente);

      return pagina(null).then(function () { partes.push("]"); return tabla(idx + 1); });

      a.click();
      URL.revokeObjectURL(a.href);
      avisar("Listo: " + bajadas + " renglones");
      setTimeout(function () { boton.textContent = textoOriginal; boton.disabled = false; }, 6000);
    });
  }).then(null, function (e) {
    boton.textContent = textoOriginal; boton.disabled = false;
    if (e && e.message === "codigo") return;
    toast("No se pudo bajar el respaldo y NO se guardó nada a medias: " + (e && e.message ? e.message : e));

}

}
function placaHTML(v, historial, duenos) {
  var v0 = historial[0], desc = v0 ? descCarro({ marca: v0.marca, submarca: v0.submarca, tipo_unidad: v0.tipo, color: v0.color }) : "", i;
  var html = '<div class="fila"><button type="button" class="chico" ' + act("volver") + '>← Volver</button><span class="pasos">Clientes <b>›</b> <b class="mono">' + h(v.placa) + "</b></span></div>";
  var dn = "";
  if (duenos && duenos.length) {
    var partes = [];
    for (i = 0; i < duenos.length; i++) partes.push("<a " + act("ir", { n: "ficha", id: duenos[i].id }) + ">" + h(facNombre(duenos[i].nombre)) + "</a>" + (duenos[i].confirmada === false ? ' <span class="tenue">(por confirmar)</span>' : ""));
    dn = (duenos.length > 1 ? "Clientes en lealtad: " : "Cliente en lealtad: ") + partes.join(", ");
  } else dn = '<span class="tenue">Sin cliente de lealtad asignado a esta placa.</span>';
  html += '<div class="card"><div class="fila entre"><div><h1 class="mono">' + h(v.placa) + '</h1><div class="muted">' + (desc ? h(desc) + " · " : "") + pl(historial.length, "visita", "visitas") + " (piso, no total)</div></div><div>" + dn + "</div></div></div>";
  if (placaSospechosa(historial)) html += '<div class="aviso rojo"><b>⚠ Esta placa aparece en carros que parecen distintos</b> (colores que no coinciden, o varios el mismo día). Casi seguro es una foto mal pegada o una placa mal leída: las visitas de abajo pueden ser de vehículos diferentes.</div>';
  html += '<div class="card"><div class="fila entre"><h2>Galería</h2><button type="button" class="chico" id="galeria-btn" ' + act("placaGaleria", v.placa) + '>📷 Ver las fotos</button></div><div id="galeria" class="muted chico-t">De la más nueva a la más vieja; cada foto abre en grande. Se cargan al tocar el botón porque cada una pesa.</div></div>';
  html += '<div class="card"><h2>Visitas</h2>' + notaPiso();
  if (!historial.length) html += '<div class="vacio">Sin visitas registradas.</div>';

    for (i = 0; i < historial.length; i++) {
      var x = historial[i], cd = descCarro({ marca: x.marca, submarca: x.submarca, tipo_unidad: x.tipo, color: x.color });

        (x.borrada ? '<td class="tenue" title="El supervisor sacó esta unidad de la cola con Borrar unidad; cuenta como visita, sin tiempos">borrada</td>' : "<td>" + horaTxt(x.salida) + "</td>") +
        "<td>" + h(x.linea != null ? x.linea : "—") + "</td><td>" + h(x.secadores && x.secadores.length ? x.secadores.join(", ") : "—") + "</td>" +
        "<td>" + (x.persona && x.persona.id ? "<a " + act("ir", { n: "ficha", id: x.persona.id }) + ">" + h(facNombre(x.persona.nombre)) + "</a>" : '<span class="tenue">— sin asignar</span>') + "</td><td>" + enlaceTicket(x.ticket) + "</td></tr>";
    }
    html += "</tbody></table></div>";
  }
  return html + "</div>";
}
function placaGaleria(placa) {
  var cont = $("#galeria"), btn = $("#galeria-btn"); if (!cont) return;
  if (btn) btn.disabled = true;

      html += '<figure class="foto">' + (fotos[i].url ? '<a href="' + h(fotos[i].url) + '" target="_blank" rel="noopener"><img src="' + h(fotos[i].url) + '" loading="lazy" alt="foto de la placa"></a>' : '<div class="foto-sinurl">No disponible</div>') + "<figcaption>" + fmtFecha(fotos[i].tomada_en) + "</figcaption></figure>";
    }
    cont.innerHTML = html + "</div>";
    if (btn) btn.hidden = true;
  }, function (e) { if (e.message === "codigo") return; cont.innerHTML = errorHTML(e); if (btn) btn.disabled = false; });
}
// Los ultimos lavados que van entrando (tabla carros): se completan solos con

function despachar(e, tipoEvento) {
  var el = e.target.closest("[data-act]"); if (!el) return;
  var esperado = el.getAttribute("data-on") || "click"; if (esperado !== tipoEvento) return;
  var fn = ACT[el.getAttribute("data-act")];
  // Un boton con un nombre que no esta en ACT NO se queda mudo (26/oct/2026):
  // asi nacieron los filtros de Supervisores y nadie lo vio, porque el toque
  // moria aqui sin ruido. Ahora lo dice en pantalla y en la consola; la prueba
  // pruebas/acciones-del-panel.sh lo ataja antes de publicar.
  if (!fn) {
    var nombre = el.getAttribute("data-act");
    if (typeof console !== "undefined" && console.error) console.error("Boton sin registrar en ACT:", nombre);
    if (typeof toast === "function") toast("Este botón no está conectado (" + nombre + "). Avísale a quien mantiene el panel.");
    return;
  }
  var args = JSON.parse(el.getAttribute("data-args") || "[]");
  if (tipoEvento === "input" || tipoEvento === "change") args.push(el.value);
  if (tipoEvento === "keydown") args.push(e);
  if (tipoEvento === "click" && el.tagName === "BUTTON" && el.disabled) return;
  fn.apply(null, args);
}
