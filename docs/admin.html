<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUSH — Panel de administración</title>

<!--
  Cuarta app del proyecto (10/oct/2026). La usa el ADMINISTRADOR, sentado,
  para corregir el CRM: fusionar fichas duplicadas, borrar fichas vacias, quitar
  y agregar visitas, mover placas. No la usan ni el supervisor ni la cajera.

  Habla con la Edge Function `admin` (NO con `app`): codigo propio del panel
  (CODIGO_ADMIN) y cabecera x-quien, porque toda accion queda en bitacora con
  nombre. Toda la logica vive en la base (migraciones 192-195): aqui no hay
  copia de ninguna regla (ni lealtad, ni fonetica, ni tipos): lo que se pinta
  lo calculo el servidor. La VISTA PREVIA de cada accion es la misma funcion
  con `ensayo: true`, que calcula sin escribir.

  Los botones van por `data-act` + un solo despacho (ver abajo), no por
  onclick="..." en el HTML: asi lo exige la pagina del prototipo y asi queda
  todo en un lugar.

  JavaScript clasico (var, function, concatenacion): pruebas/sintaxis-front.sh
  lo parsea con el interprete de Windows, que no entiende ES6.
-->

<style>
  :root {
    --bg:#0d1117; --card:#161b22; --card2:#21262d; --borde:#30363d; --fg:#e6edf3;
    --muted:#8b949e; --muted2:#6e7681; --accent:#58a6ff; --rojo:#f85149; --rojo-f:#2b1113;
    --verde:#3fb950; --verde-f:#0f2a17; --ambar:#d29922; --ambar-f:#2a2210; --morado:#a371f7;
    --cian:#39c5cf; --sombra:0 8px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
  * { box-sizing:border-box; }

  button, input, select, textarea { font:inherit; color:inherit; }
  button { background:var(--card2); border:1px solid var(--borde); border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:600; }
  button:hover { border-color:var(--muted); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primario { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.peligro { background:var(--rojo); border-color:var(--rojo); color:#fff; }
  button.peligro.suave { background:transparent; color:var(--rojo); }
  button.liso { background:transparent; border-color:transparent; color:var(--accent); padding:4px 8px; }
  button.chico { padding:4px 10px; font-size:13px; }
  input[type=text], input[type=search], select, textarea { background:var(--card); border:1px solid var(--borde); border-radius:8px; padding:9px 11px; width:100%; }
  a { color:var(--accent); cursor:pointer; text-decoration:none; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:17px; margin:0 0 10px; color:var(--fg); }
  .muted { color:var(--muted); }
  .chico-t { font-size:13px; }
  .mono { font-variant-numeric:tabular-nums; }

  #acceso { min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
  #acceso .caja { background:var(--card); border:1px solid var(--borde); border-radius:14px; padding:28px; width:100%; max-width:420px; display:grid; gap:16px; }
  #acceso input { font-size:24px; text-align:center; letter-spacing:4px; }
  .quien { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .quien button.sel { border-color:var(--accent); background:var(--card2); box-shadow:inset 0 0 0 1px var(--accent); }

  header.barra { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--card); border-bottom:1px solid var(--borde); padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .marca { font-weight:800; letter-spacing:.02em; }
  nav.tabs { display:flex; gap:4px; flex:1; flex-wrap:wrap; }
  nav.tabs button { background:transparent; border-color:transparent; color:var(--muted); padding:8px 12px; }
  nav.tabs button.on { color:var(--fg); background:var(--card2); border-color:var(--borde); }
  nav.tabs .cuenta { display:inline-block; min-width:20px; padding:0 6px; border-radius:999px; background:var(--rojo); color:#fff; font-size:12px; margin-left:6px; }
  .yo { color:var(--muted); font-size:14px; }
  main { max-width:1180px; margin:0 auto; padding-block:20px; padding-inline:16px; display:grid; gap:18px; }
  .fila { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .fila.entre { justify-content:space-between; }
  .card { background:var(--card); border:1px solid var(--borde); border-radius:12px; padding:16px; min-width:0; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .tile { background:var(--card2); border:1px solid var(--borde); border-radius:10px; padding:12px; }
  .tile .v { font-size:26px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; }
  .tile .r { color:var(--muted); font-size:12px; margin-top:4px; }
  .tile.ok { border-color:var(--verde); } .tile.ojo { border-color:var(--ambar); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--borde); vertical-align:top; }
  th { color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.apagada td { color:var(--muted2); text-decoration:line-through; }
  tr.apagada td.acc { text-decoration:none; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--card2); }
  .tabla-wrap { overflow-x:auto; }
  .chip { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; border:1px solid var(--borde); color:var(--muted); white-space:nowrap; }
  .chip.verde { color:var(--verde); border-color:var(--verde); background:var(--verde-f); }
  .chip.ambar { color:var(--ambar); border-color:var(--ambar); background:var(--ambar-f); }
  .chip.rojo { color:var(--rojo); border-color:var(--rojo); background:var(--rojo-f); }
  .chip.morado { color:var(--morado); border-color:var(--morado); }
  .chip.cian { color:var(--cian); border-color:var(--cian); }
  .aviso { background:var(--card2); border-left:4px solid var(--ambar); border-radius:6px; padding:10px 12px; font-size:14px; }
  .aviso.rojo { border-left-color:var(--rojo); }
  .aviso.verde { border-left-color:var(--verde); }
  .vacio { color:var(--muted2); font-style:italic; padding:12px 0; }
  .item { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--borde); flex-wrap:wrap; }
  .item:last-child { border-bottom:none; }
  .item .q { min-width:0; flex:1; }
  .item .q b { display:block; }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; }
  .lado { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:720px) { .lado { grid-template-columns:1fr; } }
  .col { background:var(--card2); border:2px solid var(--borde); border-radius:12px; padding:14px; }
  .col.queda { border-color:var(--verde); }
  .col.vase { border-color:var(--rojo); opacity:.9; }
  .col .enc { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .kv { display:grid; grid-template-columns:120px 1fr; gap:4px 10px; font-size:14px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  .prev { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; background:var(--card2); border-radius:10px; padding:12px; }
  .prev .ant, .prev .des { text-align:center; }
  .prev .ant .n, .prev .des .n { font-size:22px; font-weight:800; }
  .prev .fl { color:var(--muted); font-size:22px; }
  .prev .des .n { color:var(--verde); }
  .campo { display:grid; gap:6px; }
  .campo label { font-size:13px; color:var(--muted); font-weight:600; }
  .form { display:grid; gap:12px; }
  .radios { display:flex; gap:8px; flex-wrap:wrap; }
  .radios label { border:1px solid var(--borde); border-radius:8px; padding:8px 12px; cursor:pointer; display:flex; gap:6px; align-items:center; }
  .radios label.sel { border-color:var(--accent); background:var(--card2); }
  .buscar { display:flex; gap:8px; }
  .buscar input { flex:1; }
  .pasos { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:13px; flex-wrap:wrap; }
  .pasos b { color:var(--fg); }
  .res { border:1px solid var(--borde); border-radius:10px; overflow:hidden; }
  .res .r { padding:10px 12px; border-bottom:1px solid var(--borde); display:flex; justify-content:space-between; gap:10px; cursor:pointer; flex-wrap:wrap; }
  .res .r:hover { background:var(--card2); } .res .r:last-child { border-bottom:none; }
  .venta { background:var(--card2); border-radius:10px; padding:12px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .venta div b { display:block; font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .pie { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; padding-top:6px; }
  pre.json { background:var(--bg); border:1px solid var(--borde); border-radius:8px; padding:10px; font-size:12px; overflow-x:auto; margin:0; white-space:pre-wrap; }
  details summary { cursor:pointer; color:var(--accent); font-size:13px; }
  .cargando { color:var(--muted); padding:20px; text-align:center; }

  #modal { background:var(--card); border:1px solid var(--borde); border-radius:14px; padding:20px; width:100%; max-width:640px; max-height:92vh; overflow:auto; box-shadow:var(--sombra); display:grid; gap:14px; }
  #modal.ancho { max-width:900px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; z-index:30; box-shadow:var(--sombra); max-width:90vw; }
  .progreso { height:8px; background:var(--borde); border-radius:999px; overflow:hidden; margin-top:6px; }
  .progreso i { display:block; height:100%; background:var(--verde); }
  /* Pestaña Caja (211): rango de fechas, lado a lado y tablas por dia */
  .rango { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  .rango input[type=date] { background:var(--card); border:1px solid var(--borde); border-radius:8px; padding:8px 10px; min-width:150px; }
  .presets { display:flex; gap:6px; flex-wrap:wrap; }
  .presets button.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  /* Una columna por cajera (--cols la pone la pantalla); en angosto las columnas se encogen antes de desplazar. */
  .comp { display:grid; grid-template-columns: minmax(180px,1.4fr) repeat(var(--cols, 2), minmax(110px,1fr)); }
  @media (max-width:520px) { .comp { grid-template-columns: minmax(120px,1.2fr) repeat(var(--cols, 2), minmax(84px,1fr)); } }
  .tile.mal { border-color:var(--rojo); }
  .comp > div { padding:9px 10px; border-bottom:1px solid var(--borde); min-width:0; }
  .comp .enc { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .comp .enc.caj { font-size:15px; text-transform:none; letter-spacing:0; color:var(--fg); font-weight:800; }
  .comp .lbl { font-size:14px; }
  /* Supervisores (221): el punto del color del perfil junto a su nombre. */
  .punto { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; border:1px solid rgba(0,0,0,.25); }
  .comp .num { text-align:right; font-variant-numeric:tabular-nums; }
  .comp .sec { grid-column:1 / -1; background:var(--card2); color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; font-weight:600; padding:6px 10px; }
  .comp .gana { color:var(--verde); font-weight:700; }
  .comp .pct { color:var(--muted); font-size:12px; margin-left:4px; }
  .barra-ef { display:inline-block; width:56px; height:6px; background:var(--borde); border-radius:999px; vertical-align:middle; margin-right:6px; overflow:hidden; }
  .barra-ef i { display:block; height:100%; background:var(--verde); }
  .barra-ef.ojo i { background:var(--ambar); }
  .barra-ef.mal i { background:var(--rojo); }
  .turno { font-size:12px; color:var(--muted); white-space:nowrap; }
  .nota { color:var(--muted); font-size:13px; }
  .interruptor { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-size:14px; }
  .interruptor input { width:18px; height:18px; accent-color:var(--accent); }
  .cajas-dia { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:14px; }
  @media (max-width:420px) { .cajas-dia { grid-template-columns:1fr; } }
  .leyenda { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); align-items:center; }
  .leyenda span.l::before { content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .leyenda .l-ok::before { background:var(--verde); } .leyenda .l-ojo::before { background:var(--ambar); } .leyenda .l-mal::before { background:var(--rojo); }
  /* Pestaña Comisiones (215): un renglon de devolucion se ve en rojo */
  tr.dev td { color:var(--rojo); }
  tr.dev td .muted { color:var(--rojo); opacity:.8; }
</style>

<div id="acceso">
  <div class="caja">
    <div class="marca">RUSH · Panel de administración</div>
    <div class="muted chico-t">Es el código del panel, no el de la app del supervisor.</div>
    <div class="campo"><label for="campo">Código del panel</label><input id="campo" type="password" inputmode="text" autocapitalize="characters" autocomplete="off"></div>
    <div class="campo"><label>¿Quién eres?</label>
      <div class="quien" id="quienes"><div class="muted chico-t" style="grid-column:1/-1">Escribe el código y aparecen los nombres.</div></div>
      <div class="muted chico-t">Tu nombre queda en la bitácora de cada cambio.</div>
    </div>
    <div id="malcodigo" class="aviso rojo" hidden>Código incorrecto</div>
    <div id="login-err" class="aviso rojo" hidden></div>
    <button class="primario" id="entrar" type="button" style="padding:14px;font-size:16px">Entrar</button>
  </div>
</div>

<div id="app" hidden>
  <header class="barra">
    <div class="marca">RUSH · Panel</div>
    <nav class="tabs" id="tabs"></nav>
    <span class="yo" id="yo"></span>
    <button class="chico" id="salir" type="button">Salir</button>
  </header>
  <main id="vista"></main>
</div>
<div id="modal-fondo" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script>
var API = "https://rwoyfvddhlabmmuvkpjx.supabase.co/functions/v1/admin";
var PEDIR_CORTE_MS = 20000;

var CODIGO = "", QUIEN = "", QUIEN_ETIQUETA = "";
// clave -> nombre. Lo manda el servidor (/quienes, tabla admin_quienes): los
// nombres de personas no viven en esta pagina, que es publica.
var QUIENES = {};
var MOTIVOS = [];
var VISTA = { n: "bandeja" }, NAV = [], TOKEN = 0, PENDIENTES_N = null;
var TIPO = { normal: ["Normal", "verde"], canje: ["Canje", "morado"], cortesia: ["Cortesía", "cian"] };

// ---------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------
function $(s) { return document.querySelector(s); }
function h(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function act(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return 'data-act="' + fn + '" data-args="' + h(JSON.stringify(args)) + '"';
}
function on(ev, fn) {
  var args = Array.prototype.slice.call(arguments, 2);
  return 'data-on="' + ev + '" data-act="' + fn + '" data-args="' + h(JSON.stringify(args)) + '"';
}
var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
function fmtFecha(iso, conHora) {
  if (!iso) return "—";
  // Una fecha sin hora ("2026-10-10") se formatea tal cual: `new Date` la
  // leeria como medianoche UTC y en Mexicali saldria el dia anterior.
  var solo = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
  if (solo) return (+solo[3]) + "/" + MESES[+solo[2] - 1] + "/" + solo[1];
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  var p = {};
  try {
    var partes = new Intl.DateTimeFormat("es-MX", { timeZone: "America/Tijuana", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(d);
    for (var i = 0; i < partes.length; i++) p[partes[i].type] = partes[i].value;
  } catch (e) { return d.toLocaleString(); }
  var s = p.day + "/" + MESES[+p.month - 1] + "/" + p.year;
  if (conHora !== false) s += " " + p.hour + ":" + p.minute;
  return s;
}
function pesos(n) { return "$" + Number(n || 0).toLocaleString("es-MX"); }
function pl(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
function chipTipo(t) { var x = TIPO[t] || ["?", ""]; return '<span class="chip ' + x[1] + '">' + x[0] + "</span>"; }
function lealtadTxt(L) {
  if (!L) return "—";
  return (L.sellos || 0) + "/5 · " + pl(L.disponibles || 0, "gratis disponible", "gratis disponibles") + " · " + pl(L.canjes || 0, "canje", "canjes");
}
function cargando(t) { return '<div class="cargando">' + h(t || "Cargando…") + "</div>"; }
function errorHTML(e) {
  return '<div class="aviso rojo"><b>No se pudo consultar.</b> ' + h(e && e.message ? e.message : e) + ' Esto no quiere decir que no haya nada: quiere decir que la consulta falló. <a ' + act("render") + '>Reintentar</a></div>';
}
function retrasar(fn, ms) { var t; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; }

// ---------------------------------------------------------------------
// Peticiones. Igual que reporte.html (corte de 20 s, 401 pide el codigo, un
// `ok:false` es error), mas la cabecera x-quien.
// ---------------------------------------------------------------------
function pedir(ruta, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ "x-codigo": CODIGO, "x-quien": QUIEN }, opts.headers || {});
  var reloj = null;
  if (typeof AbortController === "function" && !opts.signal) {
    var corta = new AbortController();
    opts.signal = corta.signal;
    reloj = setTimeout(function () { corta.abort(); }, opts.corteMs || PEDIR_CORTE_MS);
  }
  return fetch(API + ruta, opts).then(function (r) {
    if (reloj) clearTimeout(reloj);
    return r;
  }, function (e) {
    if (reloj) clearTimeout(reloj);
    throw new Error("Sin conexión con el servidor");
  });
}
function pedirJSON(ruta, opts) {
  return pedir(ruta, opts).then(function (r) {
    if (r.status === 401) { pedirCodigo(true); throw new Error("codigo"); }
    if (r.status === 403) { pedirCodigo(false, "Falta decir quién eres"); throw new Error("codigo"); }
    if (r.status === 503) { throw new Error("El servidor no tiene configurado el código del panel"); }
    return r.json().then(function (d) {
      if (!r.ok && (!d || d.ok === undefined)) throw new Error("El servidor respondió " + r.status);
      return d;
    }, function () { throw new Error("El servidor respondió " + r.status); });
  }).then(function (d) {
    if (!d || d.ok === false) {
      var e = new Error((d && d.error) || "El servidor respondió con error");
      e.datos = d;
      throw e;
    }
    return d;
  });
}
function listaDe(d, campo) {
  var v = d && d[campo];
  if (!Array.isArray(v)) throw new Error("La respuesta no trae la lista `" + campo + "`");
  return v;
}
function postJSON(ruta, cuerpo) {
  return pedirJSON(ruta, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo || {}) });
}
// Una accion devuelve `ok:false` con su razon como respuesta NORMAL (status
// 200): aqui no es excepcion, es lo que la pantalla tiene que mostrar.
function accion(ruta, cuerpo) {
  return postJSON(ruta, cuerpo).then(function (d) { return d; }, function (e) {
    if (e && e.message === "codigo") throw e;
    if (e && e.datos && e.datos.ok === false) return e.datos;
    throw e;
  });
}

// ---------------------------------------------------------------------
// Entrar / salir
// ---------------------------------------------------------------------
function pedirCodigo(fallo, texto) {
  cerrar();   // F-9: un 401/403 con un modal abierto lo dejaba encima del login
  $("#app").hidden = true;
  $("#acceso").hidden = false;
  $("#malcodigo").hidden = !fallo;
  var le = $("#login-err"); le.hidden = !texto; le.textContent = texto || "";
  $("#campo").focus();
}
function cargarCredenciales() {
  try {
    CODIGO = localStorage.getItem("rush_codigo_admin") || "";

// ---------------------------------------------------------------------
// La previa y la confirmacion de una accion, en UN solo motor.
//
// Cada accion del panel es la misma RPC dos veces: con `ensayo:true` para la
// vista previa (calcula y revierte) y sin el para hacerlo. `cfg.cuerpo()`
// devuelve los datos de la accion (o null si falta elegir algo); `cfg.extra`
// es el HTML de lo que el administrador elige dentro del modal.
// ---------------------------------------------------------------------
var ACC = null;
function selMotivo(id, defecto) {
  var ops = '<option value="">Elige un motivo…</option>';
  for (var i = 0; i < MOTIVOS.length; i++) ops += '<option ' + (MOTIVOS[i] === defecto ? "selected" : "") + ">" + h(MOTIVOS[i]) + "</option>";
  return '<div class="campo"><label for="' + id + '">Motivo (obligatorio)</label><select id="' + id + '">' + ops + '</select></div>' +
         '<div class="campo"><label for="' + id + '-nota">Nota (opcional)</label><input id="' + id + '-nota" type="text" placeholder="Lo que quieras dejar escrito"></div>';
}
function leerMotivo(id) {
  var m = $("#" + id).value, n = $("#" + id + "-nota").value.trim();
  if (!m) { toast("Falta el motivo"); $("#" + id).focus(); return null; }
  if (m.indexOf("Otro") === 0 && !n) { toast('Con "Otro" hay que escribir la nota'); $("#" + id + "-nota").focus(); return null; }
  return { motivo: m, nota: n };
}
function abrirAccion(cfg) {
  ACC = cfg;
  abrir('<h2>' + h(cfg.titulo) + "</h2>" + (cfg.intro || "") +
        '<div id="acc-extra">' + (cfg.extra || "") + "</div>" +
        '<div id="acc-prev">' + cargando("Calculando la vista previa…") + "</div>" +
        selMotivo("acc-motivo", cfg.motivoDefecto || "") +
        '<div class="pie"><button type="button" ' + act("cerrar") + '>Cancelar</button>' +
        '<button type="button" id="acc-ok" class="' + (cfg.peligro ? "peligro" : "primario") + '" disabled ' + act("confirmarAccion") + ">" + h(cfg.boton || "Confirmar") + "</button></div>", cfg.ancho);
  previa();
}
var previaRetrasada = retrasar(function () { previa(); }, 250);
function previa() {
  var cfg = ACC; if (!cfg) return;
  var prev = $("#acc-prev"), ok = $("#acc-ok");
  if (!prev) return;
  var cuerpo = cfg.cuerpo();
  if (!cuerpo) { prev.innerHTML = '<div class="vacio">' + h(cfg.faltante || "Falta elegir…") + "</div>"; ok.disabled = true; return; }
  prev.innerHTML = cargando("Calculando la vista previa…"); ok.disabled = true;
  var mio = ++previa.n;
  var sel = $("#acc-motivo");
  cuerpo = Object.assign({}, cuerpo, { ensayo: true, motivo: (sel && sel.value) || cfg.motivoDefecto || MOTIVOS[0], nota: "vista previa" });
  accion(cfg.ruta, cuerpo).then(function (r) {
    if (mio !== previa.n || ACC !== cfg) return;
    prev.innerHTML = pintarPrevia(r);
    ok.disabled = !r.ok;
  }, function (e) {
    if (mio !== previa.n || ACC !== cfg) return;
    if (e && e.message === "codigo") return;
    prev.innerHTML = errorHTML(e); ok.disabled = true;
  });
}
previa.n = 0;
function confirmarAccion() {
  var cfg = ACC; if (!cfg) return;
  var m = leerMotivo("acc-motivo"); if (!m) return;
  var cuerpo = cfg.cuerpo(); if (!cuerpo) return;
  var ok = $("#acc-ok"); ok.disabled = true; ok.textContent = "Guardando…";
  // auditoria 10/oct (F-4): la respuesta solo toca la pantalla si ESTA accion
  // sigue abierta. Si el administrador cancelo y abrio otra, la primera ya
  // corrio en el servidor (eso no se cancela) pero no cierra ni pinta la otra.
  accion(cfg.ruta, Object.assign({}, cuerpo, m)).then(function (r) {
    if (ACC !== cfg) { if (r.ok) { toast(r.resumen || "Listo"); render(); } return; }
    if (!r.ok) { $("#acc-prev").innerHTML = pintarPrevia(r); ok.textContent = cfg.boton || "Confirmar"; return; }
    toast(r.resumen || "Listo");
    cerrar();
    if (cfg.alTerminar) cfg.alTerminar(r); else render();
  }, function (e) {
    if (e && e.message === "codigo") return;
    if (ACC !== cfg) return;
    $("#acc-prev").innerHTML = errorHTML(e); ok.disabled = false; ok.textContent = cfg.boton || "Confirmar";
  });
}
function bloqueLealtad(titulo, L) {
  return '<div><div class="muted chico-t">' + h(titulo) + '</div><div class="n">' + (L ? (L.sellos || 0) + "/5" : "—") + '</div><div class="chico-t">' +
         (L ? (L.disponibles || 0) + " gratis · " + pl(L.canjes || 0, "canje", "canjes") : "") + "</div></div>";
}
function pintarLealtad(antes, despues) {
  if (!antes && !despues) return "";
  if (antes && antes.queda) {   // fusionar: dos antes, una despues
    var a = antes.queda, b = antes.va;
    return '<div class="prev"><div class="ant"><div class="muted chico-t">Hoy, por separado</div><div class="n">' + (a.sellos || 0) + "/5 + " + (b.sellos || 0) + '/5</div><div class="chico-t">' +
           ((a.disponibles || 0) + (b.disponibles || 0)) + " gratis · " + pl((a.canjes || 0) + (b.canjes || 0), "canje", "canjes") + "</div></div>" +
           '<div class="fl">→</div><div class="des">' + bloqueLealtad("Fusionadas", despues) + "</div></div>";
  }
  if (antes && antes.origen) {   // mover: dos personas
    return '<div class="lado"><div class="prev"><div class="ant">' + bloqueLealtad("Cliente de origen · ahora", antes.origen) + '</div><div class="fl">→</div><div class="des">' + bloqueLealtad("después", despues.origen) + "</div></div>" +
           '<div class="prev"><div class="ant">' + bloqueLealtad("Cliente destino · ahora", antes.destino) + '</div><div class="fl">→</div><div class="des">' + bloqueLealtad("después", despues.destino) + "</div></div></div>";
  }
  if (antes && antes.sellos === undefined) return "";
  return '<div class="prev"><div class="ant">' + bloqueLealtad("Ahora", antes) + '</div><div class="fl">→</div><div class="des">' + bloqueLealtad("Después", despues) + "</div></div>";

function pintarPrevia(r) {

    html += '<div class="aviso ' + (ok_ ? "verde" : "rojo") + '" style="margin-bottom:8px">' + h(adv[i]) + "</div>";
  }
  html += pintarLealtad(r.lealtad_antes, r.lealtad_despues);
  if (r.visitas_movidas !== undefined) html += '<div class="chico-t" style="margin-top:8px">' + pl(r.visitas_movidas, "visita pasa", "visitas pasan") + " a la ficha que se queda · " + pl(r.placas_movidas || 0, "placa nueva", "placas nuevas") + "</div>";

// ---------------------------------------------------------------------
// CAJA: el reporte por cajera (migracion 211, 12/oct/2026). Todo lo
// calcula la base (reporte_de_caja_por_cajera); aqui solo se pinta. Las
// definiciones de cada columna estan en el desplegable del final y son
// las de la funcion. Regla del dueno (5/oct): toda metrica de caja va
// SEPARADA por cajera, con las mismas columnas, para comparar.
// ---------------------------------------------------------------------
var CAJA_SIN_PU = false;
// El ultimo reporte pintado (para que el interruptor "sin pickups" no vuelva a
// consultar) y el ultimo rango elegido (para que volver a la pestana no lo pierda).
var CAJA_CACHE = null, CAJA_RANGO = null;
var DIAS_SEMANA = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
function hoyLocal() {
  try {
    var p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Tijuana", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    if (/^\d{4}-\d{2}-\d{2}$/.test(p)) return p;
  } catch (e) { /* sin Intl: la fecha local del aparato */ }
  var d = new Date();
  return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
}
function sumarDias(iso, n) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); if (!m) return iso;
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + n));
  return d.getUTCFullYear() + "-" + ("0" + (d.getUTCMonth() + 1)).slice(-2) + "-" + ("0" + d.getUTCDate()).slice(-2);
}
function diaCorto(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso)); if (!m) return h(iso);
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return DIAS_SEMANA[d.getUTCDay()] + " " + (+m[3]) + "/" + MESES[+m[2] - 1];
}
function pctTxt(a, b) { return b ? Math.round(100 * a / b) + "%" : "—"; }
function segs(s) { if (s == null) return "—"; s = Math.round(s); return s < 60 ? s + " s" : Math.floor(s / 60) + " min " + (s % 60) + " s"; }
function esFecha(x) { return /^\d{4}-\d{2}-\d{2}$/.test(String(x || "")); }

function vCaja(v, pinta) {
  if (!esFecha(v.desde) || !esFecha(v.hasta)) {
    if (CAJA_RANGO) { v.desde = CAJA_RANGO.desde; v.hasta = CAJA_RANGO.hasta; v.preset = CAJA_RANGO.preset; }
    else { var hoy = hoyLocal(); v.hasta = hoy; v.desde = sumarDias(hoy, -6); v.preset = "7"; }
  }
  CAJA_RANGO = { desde: v.desde, hasta: v.hasta, preset: v.preset };
  // El interruptor "sin pickups" solo cambia columnas: se repinta lo ya bajado.
  if (CAJA_CACHE && CAJA_CACHE.fresca && CAJA_CACHE.desde === v.desde && CAJA_CACHE.hasta === v.hasta) {
    CAJA_CACHE.fresca = false; pinta(cajaHTML(v, CAJA_CACHE.d)); return;
  }
  pinta(cargando());
  // Sin lista=1: la vista principal no usa la lista de sin tocar, solo el conteo.
  pedirJSON("/reporte-cajeras?desde=" + encodeURIComponent(v.desde) + "&hasta=" + encodeURIComponent(v.hasta)).then(function (d) {
    if (!d || !d.cajeras) { pinta(cajaControles(v) + errorHTML("La respuesta no trae el reporte.")); return; }
    CAJA_CACHE = { desde: v.desde, hasta: v.hasta, d: d, fresca: false };
    pinta(cajaHTML(v, d));
  // Con el error se pintan tambien los controles: un rango de mas de 120 dias
  // lo rechaza la base, y sin las casillas el dueno no tenia como corregirlo
  // ("Reintentar" repetia el mismo rango).
  }, function (e) { if (e.message !== "codigo") pinta(cajaControles(v) + errorHTML(e)); });
}

function cajaHTML(v, d) {
  var caj = d.cajeras || [], T = d.total, i, j, c, t;
  var unDia = v.desde === v.hasta;
  var html = '<div class="fila entre"><div><h1>Caja</h1><div class="muted">Cómo registra cada cajera: cobertura, lectura de placa, canjes y tiempo de registro. Siempre separado por cajera, con las mismas columnas.</div></div></div>' + cajaControles(v);
  if (!T || !T.carros) return html + '<div class="card vacio">No hay ventas entre el ' + fmtFecha(v.desde) + " y el " + fmtFecha(v.hasta) + ". Prueba otro rango.</div>";

    '<div class="tile"><div class="v">' + T.carros + '</div><div class="r">carros cobrados' + (unDia ? "" : " · " + pl(T.turnos, "día", "días")) + "</div></div>" +
    '<div class="tile ' + (T.efic >= 97 ? "ok" : T.efic >= 90 ? "ojo" : "mal") + '"><div class="v">' + T.efic + '%</div><div class="r">eficiencia de caja<br><span class="chico-t">' + T.visitas + " visitas + " + T.no_asignar + " no asignar</span></div></div>" +
    '<div class="tile ' + (T.sin_tocar ? "ojo" : "ok") + '"><div class="v">' + T.sin_tocar + '</div><div class="r">lavados <button type="button" class="liso chico" ' + act("cajaSinTocar", null) + ">sin tocar</button></div></div>" +
    '<div class="tile ' + (canjesOk ? "ok" : "ojo") + '"><div class="v">' + T.canjes + " / " + T.sextos + '</div><div class="r">canjes registrados / 6to vendidos</div></div>' +
    '<div class="tile"><div class="v">' + (CAJA_SIN_PU ? pctTxt(T.leidas_sin_pu, T.capturas_sin_pu) : pctTxt(T.leidas, T.capturas)) + '</div><div class="r">placa leída en la captura' + (CAJA_SIN_PU ? " (sin pickups)" : "") + "</div></div>" +
    '<div class="tile"><div class="v">' + segs(T.med_s) + '</div><div class="r">cobro → registro, mediana</div></div>' +
    "</div>";

  // Lado a lado (una columna por cajera; el mejor de cada renglon en verde)
  function gana(vals, mayorEsMejor) {
    var mejor = null, k, out = [];
    for (k = 0; k < vals.length; k++) if (vals[k] != null && (mejor == null || (mayorEsMejor ? vals[k] > mejor : vals[k] < mejor))) mejor = vals[k];

var COM_MES = null, COM_CACHE = null, COM_MODAL = 0, COM_TARIFA_LISTO = null;

var DIAS_LARGO = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
function esMes(x) { return /^\d{4}-\d{2}$/.test(String(x || "")); }

function sumarMeses(ym, n) {
  var m = /^(\d{4})-(\d{2})$/.exec(ym); if (!m) return ym;

function mesRango(ym) {
  var m = /^(\d{4})-(\d{2})$/.exec(ym);

  return { desde: ym + "-01", hasta: ym + "-" + ("0" + fin.getUTCDate()).slice(-2) };
}
function mesTxt(ym) { var m = /^(\d{4})-(\d{2})$/.exec(ym); return m ? MESES_LARGO[+m[2] - 1] + " " + m[1] : String(ym); }
function fechaLarga(iso) {   // "martes 3 de noviembre"
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || "")); if (!m) return h(iso);
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));

    "<dt>Devoluciones</dt><dd>Se restan a quien <b>vendió</b> (no a quien procesó la devolución), con la tarifa del día de la venta, en el mes en que se devolvió. Así un mes ya pagado no cambia. Si la venta original no está en la base, se resta a quien la procesó y se avisa.</dd>" +
    "<dt>Mes negativo</dt><dd>Si una devolución deja a una cajera en negativo, ese mes no se paga: el saldo se descuenta del mes siguiente, y al pagar ése, el negativo queda marcado como descontado.</dd>" +
    "<dt>Tarifa</dt><dd>La vigente el día de la venta. Cambiarla aplica desde la fecha que digas; con una fecha pasada se recalculan esos meses y se avisa.</dd>" +
    "<dt>Fecha de pago</dt><dd>El primer martes <b>después</b> del último día del mes. Si el mes termina en martes, el martes siguiente.</dd>" +
    "<dt>Sin tarifa</dt><dd>Un producto de Aroma, Extras o Paquetes Especial vendido sin tarifa se avisa en vez de pagar cero en silencio. Con tarifa $0 deja de avisar.</dd>" +
    "<dt>Monto libre</dt><dd>Un cobro sin producto no comisiona: no se sabe qué fue.</dd>" +
    "<dt>Pagado</dt><dd>Al marcarlo se guarda el desglose tal como estaba. Queda en la bitácora y se puede deshacer.</dd>" +
    "</dl></details></div>";
  return html;
}

// Los renglones de una cajera, ticket por ticket, de lo ya bajado.
function comTickets(cajera) {
  if (!comCacheVigente(VISTA.mes)) { toast("Vuelve a cargar el mes"); return; }
  var caj = COM_CACHE.d.cajeras || [], c = null, i, r, filas = "";
  for (i = 0; i < caj.length; i++) if (caj[i].cajera === cajera) c = caj[i];
  if (!c) { toast("Esa cajera ya no está en el mes"); return; }
  for (i = 0; i < (c.renglones || []).length; i++) {
    r = c.renglones[i];
    filas += '<tr class="' + (r.devolucion ? "dev" : "") + '"><td>' + h(diaCorto(r.dia)) + " " + h(r.hora) + '</td><td class="mono">' + h(r.ticket) + "</td><td>" + h(r.producto) + (r.variante ? ' <span class="muted chico-t">' + h(r.variante) + "</span>" : "") +
             (r.devolucion ? ' <span class="chip rojo">devolución' + (r.ticket_original ? " del ticket " + h(r.ticket_original) : "") + "</span>" : "") +
             '</td><td class="num">' + h(num(r.cant)) + '</td><td class="num">' + h(pesos(r.tarifa)) + '</td><td class="num"><b>' + h(pesos(r.comision)) + "</b></td></tr>";
  }
  abrir("<h2>" + h(cajera) + " · " + h(mesTxt(COM_CACHE.mes)) + "</h2>" +
    '<p class="muted chico-t">Cada renglón con comisión, en el orden en que se cobró. El número de ticket es el de Zettle.</p>' +
    (filas ? '<div class="tabla-wrap"><table><thead><tr><th>Cuándo</th><th>Ticket</th><th>Producto</th><th class="num">Cant.</th><th class="num">Tarifa</th><th class="num">Comisión</th></tr></thead><tbody>' + filas + "</tbody></table></div>" : '<div class="vacio">Sin renglones.</div>') +
    '<div class="fila entre" style="margin-top:8px"><span class="mono"><b>Total ' + h(pesos(c.total)) + '</b></span><button type="button" class="primario" ' + act("cerrar") + ">Cerrar</button></div>", true);
}

// Marcar como pagado: una cajera o todas las pendientes del mes. Sin motivo
// (no toca datos de clientes); queda en la bitacora y se deshace.
function comPagar(ym, cajeras) {
  if (!esMes(ym) || !comCacheVigente(ym)) { toast("Vuelve a cargar el mes"); return; }
  var rg = mesRango(ym), caj = COM_CACHE.d.cajeras || [], partes = [], i, j, c;
  for (i = 0; i < cajeras.length; i++) for (j = 0; j < caj.length; j++) if (caj[j].cajera === cajeras[i]) {
    c = caj[j];
    if (num(c.total) < 0) { toast(c.cajera + " queda en " + pesos(c.total) + ": no se paga, se descuenta del mes siguiente"); return; }
    partes.push("<b>" + h(c.cajera) + " " + h(pesos(c.total)) + "</b>" + (num(c.arrastre) ? ' <span class="muted chico-t">(incluye ' + h(pesos(c.arrastre)) + " del mes anterior)</span>" : ""));
  }
  if (!partes.length) { toast("No hay a quién pagarle"); return; }
  abrirSimple("¿Marcar como pagado?", "Comisiones de <b>" + h(mesTxt(ym)) + "</b>: " + partes.join(", ") + ". Se guarda el desglose tal como está hoy. Queda en la bitácora y se puede deshacer.",
    "/comision-pagar", { desde: rg.desde, hasta: rg.hasta, cajeras: cajeras }, "Sí, ya se pagó");
}

// Cambiar o dar de alta una tarifa. El menu de productos lo da la base
// (vendidos en 180 dias en Aroma/Extras/Paquetes Especial + los que ya
// tienen tarifa). Dos pasos en el mismo modal: "Ver que cambia" corre la
// accion en ensayo y muestra el resumen y las advertencias; "Confirmar"
// la hace. Cualquier cambio en los campos vuelve al primer paso.
function comTarifa(producto) {
  var mi = ++COM_MODAL, token = TOKEN;
  COM_TARIFA_LISTO = null;
  pedirJSON("/comisiones-productos").then(function (d) {
    if (mi !== COM_MODAL || token !== TOKEN || VISTA.n !== "comisiones") return;
    var lista = listaDe(d, "productos"), ops = "", i, p, actual = null, hay = false;
    for (i = 0; i < lista.length; i++) {
      p = lista[i];
      if (producto && p.producto === producto) { hay = true; if (p.tarifa != null) actual = p.tarifa; }
      ops += '<option value="' + h(p.producto) + '"' + (producto && p.producto === producto ? " selected" : "") + ">" + h(p.producto) +
             (p.tarifa != null ? " · hoy " + h(pesos(p.tarifa)) : "") + (p.unidades ? " · " + h(num(p.unidades)) + " vendidos en 180 días" : "") + "</option>";
    }
    if (producto && !hay) ops += '<option value="' + h(producto) + '" selected>' + h(producto) + "</option>";
    ops = (producto ? "" : '<option value="">Elige un producto…</option>') + ops + '<option value="__otro">Otro (escribir el nombre)…</option>';
    abrir("<h2>" + (producto ? "Cambiar tarifa" : "Tarifa nueva") + "</h2>" +
      '<div class="form">' +
      '<div class="campo"><label for="ct-prod">Producto (tal como está en Zettle)</label><select id="ct-prod" ' + on("change", "comTarifaProd") + ">" + ops + '</select><input id="ct-otro" type="text" placeholder="Nombre exacto del producto en Zettle" hidden ' + on("input", "comTarifaCambio") + "></div>" +
      '<div class="campo"><label for="ct-monto">Comisión por unidad (pesos)</label><input id="ct-monto" type="number" min="0" step="1" inputmode="numeric" value="' + (actual != null ? h(actual) : "") + '" ' + on("input", "comTarifaCambio") + "></div>" +
      '<div class="campo"><label for="ct-desde">Aplica desde</label><input id="ct-desde" type="date" value="' + h(hoyLocal().slice(0, 8) + "01") + '" ' + on("change", "comTarifaCambio") + "></div>" +
      '<div class="campo"><label for="ct-nota">Nota (opcional)</label><input id="ct-nota" type="text" placeholder="Por qué cambia"></div>' +
      '<div id="ct-prev"></div>' +
      '<div class="muted chico-t">Con $0 el producto deja de comisionar. Lo ya pagado no cambia; lo que se vendió antes de la fecha conserva su tarifa.</div>' +
      '</div><div class="pie"><button type="button" ' + act("cerrar") + '>Cancelar</button><button type="button" class="primario" id="ct-ok" ' + act("comTarifaGuardar") + ">Ver qué cambia</button></div>");
  }, function (e) { if (e.message !== "codigo") toast("No se pudo consultar: " + (e.message || e)); });
}
function comTarifaProd(val) { var o = $("#ct-otro"); if (o) { o.hidden = val !== "__otro"; if (!o.hidden) o.focus(); } comTarifaCambio(); }
function comTarifaCambio() {
  COM_TARIFA_LISTO = null;
  var ok = $("#ct-ok"), prev = $("#ct-prev");
  if (ok) { ok.textContent = "Ver qué cambia"; ok.disabled = false; }
  if (prev) prev.innerHTML = "";
}
function comTarifaCuerpo() {
  var sel = $("#ct-prod"), otro = $("#ct-otro"), monto = $("#ct-monto"), desde = $("#ct-desde"), nota = $("#ct-nota");
  if (!sel || !monto || !desde) return null;
  var producto = sel.value === "__otro" ? recortar(otro ? otro.value : "") : sel.value;
  if (!producto) { toast("Falta el producto"); return null; }
  var m = recortar(monto.value);
  if (m === "" || isNaN(Number(m)) || Number(m) < 0) { toast("La tarifa tiene que ser un monto de cero o más"); monto.focus(); return null; }
  if (!esFecha(desde.value)) { toast("Falta desde qué día aplica"); desde.focus(); return null; }
  return { producto: producto, monto: Number(m), desde: desde.value, nota: nota ? recortar(nota.value) : "" };
}
function comPreviaTarifa(r) {
  var html = "", adv = r.advertencias || [], i;
  for (i = 0; i < adv.length; i++) html += '<div class="aviso" style="margin-bottom:8px">' + h(adv[i]) + "</div>";
  html += '<div class="prev"><div class="ant"><div class="muted chico-t">Hoy</div><div class="n">' + (r.monto_antes != null ? h(pesos(r.monto_antes)) : "sin tarifa") + '</div></div><div class="fl">→</div><div class="des"><div class="muted chico-t">Desde el ' + h(fmtFecha(r.desde)) + '</div><div class="n">' + h(pesos(r.monto)) + "</div></div></div>" +
          '<div class="muted chico-t" style="margin-top:8px">' + h(r.resumen || "") + " · Vista previa: no se guardó nada todavía.</div>";
  return html;
}
function comTarifaGuardar() {
  var cuerpo = comTarifaCuerpo(); if (!cuerpo) return;
  var ok = $("#ct-ok"), prev = $("#ct-prev"), mi = ++COM_MODAL;
  if (!ok || !prev) return;
  // La nota no cambia lo que la accion hace: editarla despues de la previa
  // no obliga a ensayar otra vez (mini auditoria de la 215, P2).
  var listo = COM_TARIFA_LISTO && JSON.stringify(mezclar(COM_TARIFA_LISTO, { nota: "" })) === JSON.stringify(mezclar(cuerpo, { nota: "" }));
  ok.disabled = true; ok.textContent = listo ? "Guardando…" : "Calculando…";
  accion("/comision-tarifa", listo ? cuerpo : mezclar(cuerpo, { ensayo: true })).then(function (r) {
    if (mi !== COM_MODAL || !$("#ct-ok")) { if (listo && r.ok) { toast(r.resumen || "Listo"); render(); } return; }
    ok.disabled = false;
    if (!r.ok) { prev.innerHTML = pintarPrevia(r); COM_TARIFA_LISTO = null; ok.textContent = "Ver qué cambia"; return; }
    if (listo) { toast(r.resumen || "Listo"); cerrar(); render(); return; }
    prev.innerHTML = comPreviaTarifa(r); COM_TARIFA_LISTO = cuerpo; ok.textContent = "Confirmar";
  }, function (e) {
    if (e && e.message === "codigo") return;
    if (mi !== COM_MODAL || !$("#ct-ok")) return;
    prev.innerHTML = errorHTML(e); ok.disabled = false; ok.textContent = listo ? "Confirmar" : "Ver qué cambia";
  });
}

// ---------------------------------------------------------------------
// DESPACHO DE ACCIONES Y ARRANQUE
// ---------------------------------------------------------------------
var ACT = { ir: ir, volver: volver, cerrar: cerrar, render: render, confirmarAccion: confirmarAccion, confirmarSimple: confirmarSimple, previaRetrasada: previaRetrasada,
  modalDescartarPar: modalDescartarPar, dudosaVista: dudosaVista, pendienteVisto: pendienteVisto, pendientesVistos: pendientesVistos, avisoAtendido: avisoAtendido, modalFecha: modalFecha, modalTicket: modalTicket,
  setQ: setQ, modalEditar: modalEditar, modalBorrar: modalBorrar, fundirCon: fundirCon, modalPlaca: modalPlaca, modalLigarPlaca: modalLigarPlaca, modalMoverPlaca: modalMoverPlaca,
  modalQuitar: modalQuitar, modalRestaurar: modalRestaurar, modalMover: modalMover, modalTipo: modalTipo, radioTipo: radioTipo, pintarDestinos: pintarDestinos, elegirDestino: elegirDestino,
  quedaRadio: quedaRadio, buscarTicket: buscarTicket, buscarTicketEnter: buscarTicketEnter, tipoAgregar: tipoAgregar, cambiarCliente: cambiarCliente,
  filtroQuien: filtroQuien, filtroAccion: filtroAccion, filtroTexto: filtroTexto, deshacer: deshacer,
  cajaSinTocar: cajaSinTocar, cajaDia: cajaDia, cajaSinTocarDia: cajaSinTocarDia, cajaDesde: cajaDesde, cajaHasta: cajaHasta, cajaPreset: cajaPreset, cajaSinPu: cajaSinPu, cajaRegistrar: cajaRegistrar,
  comMes: comMes, comTickets: comTickets, comPagar: comPagar, comTarifa: comTarifa, comTarifaProd: comTarifaProd, comTarifaCambio: comTarifaCambio, comTarifaGuardar: comTarifaGuardar };
function despachar(e, tipoEvento) {
  var el = e.target.closest("[data-act]"); if (!el) return;
  var esperado = el.getAttribute("data-on") || "click"; if (esperado !== tipoEvento) return;
  var fn = ACT[el.getAttribute("data-act")]; if (!fn) return;
  var args = JSON.parse(el.getAttribute("data-args") || "[]");
  if (tipoEvento === "input" || tipoEvento === "change") args.push(el.value);
  if (tipoEvento === "keydown") args.push(e);
  if (tipoEvento === "click" && el.tagName === "BUTTON" && el.disabled) return;
  fn.apply(null, args);
}
document.addEventListener("click", function (e) { despachar(e, "click"); });
document.addEventListener("input", function (e) { despachar(e, "input"); });
document.addEventListener("change", function (e) { despachar(e, "change"); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#modal-fondo").hidden) { cerrar(); return; } despachar(e, "keydown"); });
$("#modal-fondo").addEventListener("click", function (e) { if (e.target.id === "modal-fondo") cerrar(); });

cargarCredenciales();
if (CODIGO && QUIEN) arrancar(); else { pedirCodigo(false); if (CODIGO) { $("#campo").value = CODIGO; pedirQuienes(); } }
</script>
