<title>RUSH — Panel de administración</title>

<!--
  Cuarta app del proyecto (10/oct/2026). La usa el ADMINISTRADOR, sentado,
  para corregir el CRM: fusionar fichas duplicadas, borrar fichas vacias, quitar
  y agregar visitas, mover placas. No la usan ni el supervisor ni la cajera.

  Habla con la Edge Function `admin` (NO con `app`): codigo propio del panel
  (CODIGO_ADMIN) y cabecera x-quien, porque toda accion queda en bitacora con
  nombre. Toda la logica vive en la base (migraciones 192-195): aqui no hay
  copia de ninguna regla (ni lealtad, ni fonetica, ni tipos): lo que se pinta
  lo calculo el servidor. La VISTA PREVIA de cada accion es la misma funcion
  con `ensayo: true`, que calcula sin escribir.

  Los botones van por `data-act` + un solo despacho (ver abajo), no por
  onclick="..." en el HTML: asi lo exige la pagina del prototipo y asi queda
  todo en un lugar.

  JavaScript clasico (var, function, concatenacion): pruebas/sintaxis-front.sh
  lo parsea con el interprete de Windows, que no entiende ES6.
-->

<style>

  .tabla-wrap { overflow-x:auto; }

  .chip.verde { color:var(--verde); border-color:var(--verde); background:var(--verde-f); }
  .chip.ambar { color:var(--ambar); border-color:var(--ambar); background:var(--ambar-f); }
  .chip.rojo { color:var(--rojo); border-color:var(--rojo); background:var(--rojo-f); }

  .vacio { color:var(--muted2); font-style:italic; padding:12px 0; }
  .item { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--borde); flex-wrap:wrap; }

  .item .q { min-width:0; flex:1; }
  .item .q b { display:block; }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; }
  .lado { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:720px) { .lado { grid-template-columns:1fr; } }
  .col { background:var(--card2); border:2px solid var(--borde); border-radius:12px; padding:14px; }

  .campo { display:grid; gap:6px; }
  .campo label { font-size:13px; color:var(--muted); font-weight:600; }
  .form { display:grid; gap:12px; }
  .radios { display:flex; gap:8px; flex-wrap:wrap; }

  .buscar { display:flex; gap:8px; }

  .res { border:1px solid var(--borde); border-radius:10px; overflow:hidden; }

  .comp { display:grid; }

  .comp .enc { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .comp .enc.caj { font-size:15px; text-transform:none; letter-spacing:0; color:var(--fg); font-weight:800; }
  .comp .lbl { font-size:14px; }
  .comp .num { text-align:right; font-variant-numeric:tabular-nums; }
  .comp .sec { grid-column:1 / -1; background:var(--card2); color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; font-weight:600; padding:6px 10px; }
  .comp .gana { color:var(--verde); font-weight:700; }
  .comp .pct { color:var(--muted); font-size:12px; margin-left:4px; }
  .barra-ef { display:inline-block; width:56px; height:6px; background:var(--borde); border-radius:999px; vertical-align:middle; margin-right:6px; overflow:hidden; }
  .barra-ef i { display:block; height:100%; background:var(--verde); }
  .barra-ef.ojo i { background:var(--ambar); }
  .barra-ef.mal i { background:var(--rojo); }
  .turno { font-size:12px; color:var(--muted); white-space:nowrap; }

  .interruptor { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-size:14px; }

  @media (max-width:420px) { .cajas-dia { grid-template-columns:1fr; } }
  .leyenda { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); align-items:center; }

  .leyenda .l-ok::before { background:var(--verde); } .leyenda .l-ojo::before { background:var(--ambar); } .leyenda .l-mal::before { background:var(--rojo); }
</style>

<div id="acceso">
  <div class="caja">
    <div class="marca">RUSH · Panel de administración</div>
    <div class="muted chico-t">Es el código del panel, no el de la app del supervisor.</div>
    <div class="campo"><label for="campo">Código del panel</label><input id="campo" type="password" inputmode="text" autocapitalize="characters" autocomplete="off"></div>
    <div class="campo"><label>¿Quién eres?</label>
      <div class="quien" id="quienes"><div class="muted chico-t" style="grid-column:1/-1">Escribe el código y aparecen los nombres.</div></div>
      <div class="muted chico-t">Tu nombre queda en la bitácora de cada cambio.</div>
    </div>
    <div id="malcodigo" class="aviso rojo" hidden>Código incorrecto</div>
    <div id="login-err" class="aviso rojo" hidden></div>
    <button class="primario" id="entrar" type="button" style="padding:14px;font-size:16px">Entrar</button>
  </div>
</div>

<div id="app" hidden>
  <header class="barra">
    <div class="marca">RUSH · Panel</div>
    <nav class="tabs" id="tabs"></nav>
    <span class="yo" id="yo"></span>
    <button class="chico" id="salir" type="button">Salir</button>
  </header>
  <main id="vista"></main>
</div>
<div id="modal-fondo" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script>
var API = "https://rwoyfvddhlabmmuvkpjx.supabase.co/functions/v1/admin";
var PEDIR_CORTE_MS = 20000;

var CODIGO = "", QUIEN = "", QUIEN_ETIQUETA = "";
// clave -> nombre. Lo manda el servidor (/quienes, tabla admin_quienes): los
// nombres de personas no viven en esta pagina, que es publica.
var QUIENES = {};
var MOTIVOS = [];
var VISTA = { n: "bandeja" }, NAV = [], TOKEN = 0, PENDIENTES_N = null;
var TIPO = { normal: ["Normal", "verde"], canje: ["Canje", "morado"], cortesia: ["Cortesía", "cian"] };

// ---------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------
function $(s) { return document.querySelector(s); }
function h(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function act(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return 'data-act="' + fn + '" data-args="' + h(JSON.stringify(args)) + '"';
}
function on(ev, fn) {
  var args = Array.prototype.slice.call(arguments, 2);
  return 'data-on="' + ev + '" data-act="' + fn + '" data-args="' + h(JSON.stringify(args)) + '"';
}
var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
function fmtFecha(iso, conHora) {
  if (!iso) return "—";
  // Una fecha sin hora ("2026-10-10") se formatea tal cual: `new Date` la
  // leeria como medianoche UTC y en Mexicali saldria el dia anterior.
  var solo = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
  if (solo) return (+solo[3]) + "/" + MESES[+solo[2] - 1] + "/" + solo[1];
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  var p = {};
  try {
    var partes = new Intl.DateTimeFormat("es-MX", { timeZone: "America/Tijuana", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(d);
    for (var i = 0; i < partes.length; i++) p[partes[i].type] = partes[i].value;
  } catch (e) { return d.toLocaleString(); }
  var s = p.day + "/" + MESES[+p.month - 1] + "/" + p.year;
  if (conHora !== false) s += " " + p.hour + ":" + p.minute;
  return s;
}
function pesos(n) { return "$" + Number(n || 0).toLocaleString("es-MX"); }
function pl(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
function chipTipo(t) { var x = TIPO[t] || ["?", ""]; return '<span class="chip ' + x[1] + '">' + x[0] + "</span>"; }
function lealtadTxt(L) {
  if (!L) return "—";
  return (L.sellos || 0) + "/5 · " + pl(L.disponibles || 0, "gratis disponible", "gratis disponibles") + " · " + pl(L.canjes || 0, "canje", "canjes");
}
function cargando(t) { return '<div class="cargando">' + h(t || "Cargando…") + "</div>"; }
function errorHTML(e) {
  return '<div class="aviso rojo"><b>No se pudo consultar.</b> ' + h(e && e.message ? e.message : e) + ' Esto no quiere decir que no haya nada: quiere decir que la consulta falló. <a ' + act("render") + '>Reintentar</a></div>';
}
function retrasar(fn, ms) { var t; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; }

// ---------------------------------------------------------------------
// Peticiones. Igual que reporte.html (corte de 20 s, 401 pide el codigo, un
// `ok:false` es error), mas la cabecera x-quien.
// ---------------------------------------------------------------------
function pedir(ruta, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ "x-codigo": CODIGO, "x-quien": QUIEN }, opts.headers || {});
  var reloj = null;
  if (typeof AbortController === "function" && !opts.signal) {
    var corta = new AbortController();
    opts.signal = corta.signal;
    reloj = setTimeout(function () { corta.abort(); }, opts.corteMs || PEDIR_CORTE_MS);
  }
  return fetch(API + ruta, opts).then(function (r) {
    if (reloj) clearTimeout(reloj);
    return r;
  }, function (e) {
    if (reloj) clearTimeout(reloj);
    throw new Error("Sin conexión con el servidor");
  });
}
function pedirJSON(ruta, opts) {
  return pedir(ruta, opts).then(function (r) {
    if (r.status === 401) { pedirCodigo(true); throw new Error("codigo"); }
    if (r.status === 403) { pedirCodigo(false, "Falta decir quién eres"); throw new Error("codigo"); }
    if (r.status === 503) { throw new Error("El servidor no tiene configurado el código del panel"); }
    return r.json().then(function (d) {
      if (!r.ok && (!d || d.ok === undefined)) throw new Error("El servidor respondió " + r.status);
      return d;
    }, function () { throw new Error("El servidor respondió " + r.status); });
  }).then(function (d) {
    if (!d || d.ok === false) {
      var e = new Error((d && d.error) || "El servidor respondió con error");
      e.datos = d;
      throw e;
    }
    return d;
  });
}
function listaDe(d, campo) {
  var v = d && d[campo];
  if (!Array.isArray(v)) throw new Error("La respuesta no trae la lista `" + campo + "`");
  return v;
}
function postJSON(ruta, cuerpo) {
  return pedirJSON(ruta, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo || {}) });
}
// Una accion devuelve `ok:false` con su razon como respuesta NORMAL (status
// 200): aqui no es excepcion, es lo que la pantalla tiene que mostrar.
function accion(ruta, cuerpo) {
  return postJSON(ruta, cuerpo).then(function (d) { return d; }, function (e) {
    if (e && e.message === "codigo") throw e;
    if (e && e.datos && e.datos.ok === false) return e.datos;
    throw e;
  });
}

// ---------------------------------------------------------------------
// Entrar / salir
// ---------------------------------------------------------------------
function pedirCodigo(fallo, texto) {
  cerrar();   // F-9: un 401/403 con un modal abierto lo dejaba encima del login
  $("#app").hidden = true;
  $("#acceso").hidden = false;
  $("#malcodigo").hidden = !fallo;
  var le = $("#login-err"); le.hidden = !texto; le.textContent = texto || "";
  $("#campo").focus();
}
function cargarCredenciales() {
  try {
    CODIGO = localStorage.getItem("rush_codigo_admin") || "";
    QUIEN = localStorage.getItem("rush_admin_quien") || "";
  } catch (e) { CODIGO = ""; QUIEN = ""; }
  QUIEN_ETIQUETA = "";
}
// Los botones de "quien eres" se pintan con lo que diga el servidor, que lo
// contesta solo con el codigo correcto. Se piden al cargar (si ya hay codigo
// guardado) y al terminar de teclear el codigo.
var pedirQuienes = retrasar(function () {
  var cont = $("#quienes");
  if (!CODIGO) return;
  pedirJSON("/quienes").then(function (d) {
    var lista = listaDe(d, "quienes"), html = "";
    QUIENES = {};
    for (var i = 0; i < lista.length; i++) {
      QUIENES[lista[i].clave] = lista[i].nombre;

// ---------------------------------------------------------------------
// La previa y la confirmacion de una accion, en UN solo motor.
//
// Cada accion del panel es la misma RPC dos veces: con `ensayo:true` para la
// vista previa (calcula y revierte) y sin el para hacerlo. `cfg.cuerpo()`
// devuelve los datos de la accion (o null si falta elegir algo); `cfg.extra`
// es el HTML de lo que el administrador elige dentro del modal.
// ---------------------------------------------------------------------
var ACC = null;
function selMotivo(id, defecto) {
  var ops = '<option value="">Elige un motivo…</option>';
  for (var i = 0; i < MOTIVOS.length; i++) ops += '<option ' + (MOTIVOS[i] === defecto ? "selected" : "") + ">" + h(MOTIVOS[i]) + "</option>";
  return '<div class="campo"><label for="' + id + '">Motivo (obligatorio)</label><select id="' + id + '">' + ops + '</select></div>' +
         '<div class="campo"><label for="' + id + '-nota">Nota (opcional)</label><input id="' + id + '-nota" type="text" placeholder="Lo que quieras dejar escrito"></div>';
}
function leerMotivo(id) {
  var m = $("#" + id).value, n = $("#" + id + "-nota").value.trim();
  if (!m) { toast("Falta el motivo"); $("#" + id).focus(); return null; }
  if (m.indexOf("Otro") === 0 && !n) { toast('Con "Otro" hay que escribir la nota'); $("#" + id + "-nota").focus(); return null; }
  return { motivo: m, nota: n };
}
function abrirAccion(cfg) {
  ACC = cfg;
  abrir('<h2>' + h(cfg.titulo) + "</h2>" + (cfg.intro || "") +
        '<div id="acc-extra">' + (cfg.extra || "") + "</div>" +
        '<div id="acc-prev">' + cargando("Calculando la vista previa…") + "</div>" +
        selMotivo("acc-motivo", cfg.motivoDefecto || "") +
        '<div class="pie"><button type="button" ' + act("cerrar") + '>Cancelar</button>' +
        '<button type="button" id="acc-ok" class="' + (cfg.peligro ? "peligro" : "primario") + '" disabled ' + act("confirmarAccion") + ">" + h(cfg.boton || "Confirmar") + "</button></div>", cfg.ancho);
  previa();
}
var previaRetrasada = retrasar(function () { previa(); }, 250);
function previa() {
  var cfg = ACC; if (!cfg) return;
  var prev = $("#acc-prev"), ok = $("#acc-ok");
  if (!prev) return;
  var cuerpo = cfg.cuerpo();
  if (!cuerpo) { prev.innerHTML = '<div class="vacio">' + h(cfg.faltante || "Falta elegir…") + "</div>"; ok.disabled = true; return; }
  prev.innerHTML = cargando("Calculando la vista previa…"); ok.disabled = true;
  var mio = ++previa.n;
  var sel = $("#acc-motivo");
  cuerpo = Object.assign({}, cuerpo, { ensayo: true, motivo: (sel && sel.value) || cfg.motivoDefecto || MOTIVOS[0], nota: "vista previa" });
  accion(cfg.ruta, cuerpo).then(function (r) {
    if (mio !== previa.n || ACC !== cfg) return;
    prev.innerHTML = pintarPrevia(r);
    ok.disabled = !r.ok;
  }, function (e) {
    if (mio !== previa.n || ACC !== cfg) return;
    if (e && e.message === "codigo") return;
    prev.innerHTML = errorHTML(e); ok.disabled = true;
  });
}
previa.n = 0;
function confirmarAccion() {
  var cfg = ACC; if (!cfg) return;
  var m = leerMotivo("acc-motivo"); if (!m) return;
  var cuerpo = cfg.cuerpo(); if (!cuerpo) return;
  var ok = $("#acc-ok"); ok.disabled = true; ok.textContent = "Guardando…";
  // auditoria 10/oct (F-4): la respuesta solo toca la pantalla si ESTA accion
  // sigue abierta. Si el administrador cancelo y abrio otra, la primera ya
  // corrio en el servidor (eso no se cancela) pero no cierra ni pinta la otra.
  accion(cfg.ruta, Object.assign({}, cuerpo, m)).then(function (r) {
    if (ACC !== cfg) { if (r.ok) { toast(r.resumen || "Listo"); render(); } return; }
    if (!r.ok) { $("#acc-prev").innerHTML = pintarPrevia(r); ok.textContent = cfg.boton || "Confirmar"; return; }
    toast(r.resumen || "Listo");
    cerrar();
    if (cfg.alTerminar) cfg.alTerminar(r); else render();
  }, function (e) {
    if (e && e.message === "codigo") return;

  });
}
function bloqueLealtad(titulo, L) {

         (L ? (L.disponibles || 0) + " gratis · " + pl(L.canjes || 0, "canje", "canjes") : "") + "</div></div>";

function pintarLealtad(antes, despues) {
  if (!antes && !despues) return "";

    var a = antes.queda, b = antes.va;
    return '<div class="prev"><div class="ant"><div class="muted chico-t">Hoy, por separado</div><div class="n">' + (a.sellos || 0) + "/5 + " + (b.sellos || 0) + '/5</div><div class="chico-t">' +

           '<div class="fl">→</div><div class="des">' + bloqueLealtad("Fusionadas", despues) + "</div></div>";
  }
  if (antes && antes.origen) {   // mover: dos personas
    return '<div class="lado"><div class="prev"><div class="ant">' + bloqueLealtad("Cliente de origen · ahora", antes.origen) + '</div><div class="fl">→</div><div class="des">' + bloqueLealtad("después", despues.origen) + "</div></div>" +

  }
  if (antes && antes.sellos === undefined) return "";
  return '<div class="prev"><div class="ant">' + bloqueLealtad("Ahora", antes) + '</div><div class="fl">→</div><div class="des">' + bloqueLealtad("Después", despues) + "</div></div>";

    if (/^\d{4}-\d{2}-\d{2}$/.test(p)) return p;

  html += '<div class="sec">Cobertura</div>' +
    fila("Carros cobrados", "carros") +
    fila("Visitas registradas", "visitas", conPct("carros")) +
    fila("\"No asignar a cliente\"", "no_asignar") +
    fila("Sin tocar", "sin_tocar", function (x, tt, k) { return "<a " + act("cajaSinTocar", caj[k].cajera) + ">" + x + "</a>"; }, "menor") +
    fila("<b>Eficiencia</b>", "efic", function (x) { return "<b>" + x + "%</b>"; }, "mayor") +
    '<div class="sec">Cámara de la caja</div>' +
    fila("Capturas", "capturas", conPct("carros")) +
    fila("Placa leída", "leidas", conPct("capturas"), "mayor") +
    fila("Placa leída sin pickups", "leidas_sin_pu", conPct("capturas_sin_pu"), "mayor") +
    fila("Pickups: capturas / leídas", function (tt) { return tt.pickups + " / " + (tt.leidas - tt.leidas_sin_pu); }) +
    fila("Placas tecleadas a mano", "tecleadas") +
    '<div class="sec">Lealtad</div>' +
    fila("Canjes / 6to vendidos", function (tt) { return tt.canjes + " / " + tt.sextos; }, function (x, tt) { return x + (tt.canjes === tt.sextos ? "" : ' <span class="chip rojo">no cuadra</span>'); }) +
    fila("Cortesías registradas", "cortesias") +
    '<div class="sec">Tiempo de registro</div>' +
    fila("Cobro → registro, mediana", "med_s", segs, "menor") +
    fila("Cobro → registro, p90", "p90_s", segs, "menor") +
    '<div class="sec">Contexto (no es de la caja)</div>' +
    fila("Unidades borradas por el supervisor", "borrados") +
    "</div></div>" +
    '<div class="nota" style="margin-top:10px">Eficiencia = (visitas + "no asignar") / carros. Un lavado sin cliente no es omisión si pasó por "No asignar a cliente". Las pickups no se reparten parejo entre turnos: por eso la lectura se compara también sin ellas.</div></div>';

  // Por dia, una tarjeta por cajera
  html += '<div class="cajas-dia">';
  for (i = 0; i < caj.length; i++) {
    c = caj[i];
    var filas = "";
    for (j = 0; j < (c.dias || []).length; j++) {
      t = c.dias[j];
      var cls = t.efic >= 97 ? "" : t.efic >= 90 ? "ojo" : "mal";
      var lei = CAJA_SIN_PU ? t.leidas_sin_pu + "/" + t.capturas_sin_pu : t.leidas + "/" + t.capturas;
      filas += '<tr class="click" ' + act("cajaDia", c.cajera, t.dia) + "><td>" + diaCorto(t.dia) + '</td><td class="turno">' + h(t.primera) + "–" + h(t.ultima) + (t.sola ? ' <span class="chip cian">sola</span>' : "") + "</td>" +
        '<td class="num">' + t.carros + '</td><td class="num">' + t.visitas + '</td><td class="num">' + t.no_asignar + "</td>" +
        '<td class="num">' + (t.sin_tocar ? '<b style="color:var(--ambar)">' + t.sin_tocar + "</b>" : "0") + "</td>" +
        '<td class="num"><span class="barra-ef ' + cls + '"><i style="width:' + t.efic + '%"></i></span>' + t.efic + "%</td>" +
        '<td class="num">' + lei + '</td><td class="num">' + t.canjes + "/" + t.sextos + '</td><td class="num">' + segs(t.med_s) + "</td></tr>";
    }
    html += '<div class="card"><div class="fila entre"><h2>' + h(c.cajera) + '</h2><span class="nota">Toca un día para ver el detalle</span></div>' +
      '<div class="tabla-wrap"><table><thead><tr><th>Día</th><th>Horas</th><th class="num">Carros</th><th class="num">Visitas</th><th class="num">No asignar</th><th class="num">Sin tocar</th><th class="num">Efic.</th><th class="num">Placa leída' + (CAJA_SIN_PU ? " (sin PU)" : "") + '</th><th class="num">Canjes/6to</th><th class="num">Mediana</th></tr></thead><tbody>' + filas + "</tbody></table></div></div>";
  }
  html += "</div>" +
    '<div class="leyenda"><span class="l l-ok">Eficiencia 97% o más</span><span class="l l-ojo">90 a 96%</span><span class="l l-mal">Menos de 90%</span><span><span class="chip cian">sola</span> cubrió el día completo</span></div>' +
    '<div class="card"><details><summary>Cómo se mide cada columna</summary><dl class="kv" style="margin-top:10px;grid-template-columns:200px 1fr">' +
    "<dt>Carros</dt><dd>Lavados cobrados por esa cajera en Zettle. Sin pruebas ni devoluciones. Un \"Borrar unidad\" sí cuenta: el cliente pagó.</dd>" +
    "<dt>Visitas</dt><dd>Registradas en la caja, ligadas a su lavado.</dd>" +
    "<dt>No asignar</dt><dd>Sin visita, pero con captura de la cámara pegada: pasó por \"No asignar a cliente\". Cuenta como atendido.</dd>" +
    "<dt>Sin tocar</dt><dd>Sin visita y sin captura. La omisión real, o un cliente que declinó sin que se tomara la foto.</dd>" +
    "<dt>Placa leída</dt><dd>Capturas de la cámara de caja en que la placa se leyó y sigue siendo la foto del carro. Si el supervisor retomó la foto en el patio, cuenta como no leída: es una aproximación.</dd>" +
    "<dt>Canjes / 6to</dt><dd>Lavados gratis vendidos contra los registrados como canje. Deben ser iguales.</dd>" +
    "<dt>Cobro → registro</dt><dd>Segundos entre el cobro en Zettle y el registro en la caja.</dd>" +
    "</dl></details></div>";
  return html;
}

// Los modales vuelven a preguntar a la base (el rango de la vista, o un dia):
// es una consulta chica y asi no se guarda una copia que pueda quedar vieja.
function cajaSinTocar(cajera, desde, hasta) {
  var de = esFecha(desde) ? desde : VISTA.desde, ha = esFecha(hasta) ? hasta : VISTA.hasta;
  pedirJSON("/reporte-cajeras?desde=" + encodeURIComponent(de) + "&hasta=" + encodeURIComponent(ha)).then(function (d) {
    var lista = [], i, x;
    for (i = 0; i < (d.sin_tocar || []).length; i++) { x = d.sin_tocar[i]; if (!cajera || x.cajera === cajera) lista.push(x); }
    var filas = "";
    for (i = 0; i < lista.length; i++) {
      x = lista[i];
      filas += "<tr><td>" + diaCorto(x.dia) + " " + h(x.hora) + "</td><td>" + h(x.cajera) + '</td><td class="mono">' + x.carro_id + "</td><td>" + h(x.nota || "") + (x.borrado ? ' <span class="chip">borrado</span>' : "") + "</td><td>" + h(x.producto || "") + (x.variante ? " / " + h(x.variante) : "") + "</td><td>" +
        (x.ticket ? '<button type="button" class="chico" ' + act("cajaRegistrar", x.ticket) + ">Registrar visita…</button>" : '<span class="muted chico-t">sin ticket</span>') + "</td></tr>";
    }
    abrir("<h2>Lavados sin tocar" + (cajera ? " · " + h(cajera) : "") + "</h2>" +
      '<p class="muted chico-t">Sin visita y sin captura de la cámara. Si la nota de caja trae el nombre del cliente, fue descuido; si sólo trae tipo y color, no se distingue de un cliente que declinó. Se registran con la misma pantalla "Agregar visita por ticket".</p>' +
      (lista.length ? '<div class="tabla-wrap"><table><thead><tr><th>Cuándo</th><th>Cajera</th><th>Carro</th><th>Nota de caja</th><th>Servicio</th><th></th></tr></thead><tbody>' + filas + "</tbody></table></div>" : '<div class="vacio">Ninguno en este rango.</div>') +
      '<div class="pie"><button type="button" ' + act("cerrar") + ">Cerrar</button></div>", true);
  }, function (e) { if (e.message !== "codigo") toast("No se pudo consultar: " + (e.message || e)); });
}
function cajaDia(cajera, dia) {
  var v = VISTA;
  pedirJSON("/reporte-cajeras?desde=" + encodeURIComponent(dia) + "&hasta=" + encodeURIComponent(dia)).then(function (d) {
    var f = null, otras = [], i;
    for (i = 0; i < (d.cajeras || []).length; i++) { if (d.cajeras[i].cajera === cajera) f = d.cajeras[i].total; else otras.push(d.cajeras[i]); }
    if (!f) { toast("Ese día ya no trae datos de " + cajera); return; }
    var st = [], x;
    for (i = 0; i < (d.sin_tocar || []).length; i++) { x = d.sin_tocar[i]; if (x.cajera === cajera) st.push("carro " + x.carro_id + " a las " + h(x.hora) + " (" + h(x.nota || "sin nota") + ")"); }
    var quien = "";
    for (i = 0; i < otras.length; i++) quien += '<span class="muted chico-t">' + h(otras[i].cajera) + " cubrió de " + h(otras[i].total.primera) + " a " + h(otras[i].total.ultima) + "</span>";
    abrir("<h2>" + h(cajera) + " · " + diaCorto(dia) + "</h2>" +
      '<div class="fila"><span class="chip">' + h(f.primera) + " a " + h(f.ultima) + "</span>" + (otras.length ? quien : '<span class="chip cian">cubrió el día completo sola</span>') + "</div>" +
      '<div class="tiles">' +
      '<div class="tile"><div class="v">' + f.carros + '</div><div class="r">carros</div></div>' +
      '<div class="tile ' + (f.efic >= 97 ? "ok" : "ojo") + '"><div class="v">' + f.efic + '%</div><div class="r">eficiencia</div></div>' +
      '<div class="tile"><div class="v">' + f.leidas + "/" + f.capturas + '</div><div class="r">placa leída · sin pickups ' + f.leidas_sin_pu + "/" + f.capturas_sin_pu + "</div></div>" +
      '<div class="tile"><div class="v">' + segs(f.med_s) + '</div><div class="r">mediana · p90 ' + segs(f.p90_s) + "</div></div></div>" +
      '<dl class="kv" style="grid-template-columns:220px 1fr">' +
      "<dt>Visitas registradas</dt><dd>" + f.visitas + " de " + f.carros + "</dd>" +
      '<dt>"No asignar a cliente"</dt><dd>' + f.no_asignar + "</dd>" +
      "<dt>Sin tocar</dt><dd>" + f.sin_tocar + (st.length ? ": " + st.join(", ") : "") + "</dd>" +
      "<dt>Pickups capturadas</dt><dd>" + f.pickups + ", leídas " + (f.leidas - f.leidas_sin_pu) + "</dd>" +
      "<dt>Canjes / 6to vendidos</dt><dd>" + f.canjes + " / " + f.sextos + (f.canjes === f.sextos ? ' <span class="chip verde">cuadra</span>' : ' <span class="chip rojo">no cuadra</span>') + "</dd>" +
      "<dt>Cortesías</dt><dd>" + f.cortesias + "</dd>" +
      "<dt>Placas tecleadas</dt><dd>" + f.tecleadas + "</dd>" +
      "<dt>Borradas por el supervisor</dt><dd>" + f.borrados + ' <span class="muted chico-t">(no es de la caja)</span></dd></dl>' +
      '<div class="pie">' + (st.length ? '<button type="button" ' + act("cajaSinTocarDia", cajera, dia) + ">Ver los sin tocar</button>" : "") + '<button type="button" class="primario" ' + act("cerrar") + ">Cerrar</button></div>");
  }, function (e) { if (e.message !== "codigo") toast("No se pudo consultar: " + (e.message || e)); });
}
function cajaSinTocarDia(cajera, dia) { cajaSinTocar(cajera, dia, dia); }
function cajaDesde(x) { if (!esFecha(x)) return; if (esFecha(VISTA.hasta) && x > VISTA.hasta) { toast("El primer día tiene que ser antes que el segundo."); render(); return; } VISTA.desde = x; VISTA.preset = ""; render(); }
function cajaHasta(x) { if (!esFecha(x)) return; if (esFecha(VISTA.desde) && x < VISTA.desde) { toast("El primer día tiene que ser antes que el segundo."); render(); return; } VISTA.hasta = x; VISTA.preset = ""; render(); }
function cajaPreset(k) {
  var hoy = hoyLocal(), m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(hoy);
  // La semana corre de lunes a domingo, como el reporte del lunes.
  var dow = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).getUTCDay(), lunes = sumarDias(hoy, -((dow + 6) % 7));
  if (k === "sem") { VISTA.desde = lunes; VISTA.hasta = hoy; }
  if (k === "ant") { VISTA.desde = sumarDias(lunes, -7); VISTA.hasta = sumarDias(lunes, -1); }
  if (k === "14") { VISTA.desde = sumarDias(hoy, -13); VISTA.hasta = hoy; }
  if (k === "mes") { VISTA.desde = hoy.slice(0, 8) + "01"; VISTA.hasta = hoy; }
  if (k === "ayer") { VISTA.desde = sumarDias(hoy, -1); VISTA.hasta = VISTA.desde; }
  VISTA.preset = k; render();
}
function cajaSinPu() { var el = $("#caja-sinpu"); CAJA_SIN_PU = !!(el && el.checked); render(); }
function cajaRegistrar(ticket) { cerrar(); ir({ n: "agregar", ticket: String(ticket) }); }

// ---------------------------------------------------------------------
// DESPACHO DE ACCIONES Y ARRANQUE
// ---------------------------------------------------------------------
var ACT = { ir: ir, volver: volver, cerrar: cerrar, render: render, confirmarAccion: confirmarAccion, confirmarSimple: confirmarSimple, previaRetrasada: previaRetrasada,
  modalDescartarPar: modalDescartarPar, dudosaVista: dudosaVista, pendienteVisto: pendienteVisto, pendientesVistos: pendientesVistos, avisoAtendido: avisoAtendido, modalFecha: modalFecha, modalTicket: modalTicket,
  setQ: setQ, modalEditar: modalEditar, modalBorrar: modalBorrar, fundirCon: fundirCon, modalPlaca: modalPlaca, modalLigarPlaca: modalLigarPlaca, modalMoverPlaca: modalMoverPlaca,
  modalQuitar: modalQuitar, modalRestaurar: modalRestaurar, modalMover: modalMover, modalTipo: modalTipo, radioTipo: radioTipo, pintarDestinos: pintarDestinos, elegirDestino: elegirDestino,
  quedaRadio: quedaRadio, buscarTicket: buscarTicket, buscarTicketEnter: buscarTicketEnter, tipoAgregar: tipoAgregar, cambiarCliente: cambiarCliente,
  filtroQuien: filtroQuien, filtroAccion: filtroAccion, filtroTexto: filtroTexto, deshacer: deshacer,
  cajaSinTocar: cajaSinTocar, cajaDia: cajaDia, cajaSinTocarDia: cajaSinTocarDia, cajaDesde: cajaDesde, cajaHasta: cajaHasta, cajaPreset: cajaPreset, cajaSinPu: cajaSinPu, cajaRegistrar: cajaRegistrar };
function despachar(e, tipoEvento) {
  var el = e.target.closest("[data-act]"); if (!el) return;
  var esperado = el.getAttribute("data-on") || "click"; if (esperado !== tipoEvento) return;
  var fn = ACT[el.getAttribute("data-act")]; if (!fn) return;
  var args = JSON.parse(el.getAttribute("data-args") || "[]");
  if (tipoEvento === "input" || tipoEvento === "change") args.push(el.value);
  if (tipoEvento === "keydown") args.push(e);
  if (tipoEvento === "click" && el.tagName === "BUTTON" && el.disabled) return;
  fn.apply(null, args);
}
document.addEventListener("click", function (e) { despachar(e, "click"); });
document.addEventListener("input", function (e) { despachar(e, "input"); });
document.addEventListener("change", function (e) { despachar(e, "change"); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#modal-fondo").hidden) { cerrar(); return; } despachar(e, "keydown"); });
$("#modal-fondo").addEventListener("click", function (e) { if (e.target.id === "modal-fondo") cerrar(); });

cargarCredenciales();
if (CODIGO && QUIEN) arrancar(); else { pedirCodigo(false); if (CODIGO) { $("#campo").value = CODIGO; pedirQuienes(); } }
</script>
